/* ============================================================
 * 性价比档算法——权威实现。
 * 写作规范与 SKILL 引用此处；改档位规则先改这里。
 * ============================================================ */
const COST_W = { 难受:{'0':0,'少':1,'中':2,'多':3}, 时间:{'0':0,'少':1,'中':2,'多':3}, 毅力:{'否':0,'些':1,'是':2} };
const BEN_W  = { '大':3, '中':2, '小':1 };
function tierOf(e){
  if(e.safe) return '安全优先';
  const cost = COST_W.难受[e.难受] + COST_W.时间[e.时间] + COST_W.毅力[e.毅力];
  const ben = BEN_W[e.收益];
  if(ben===3 && cost===0) return '极高';
  if((ben===3 && cost<=2) || (ben===2 && cost===0)) return '高';
  return '一般';
}

/* ---------------- 解析 ---------------- */
const FIELDS = ['成本','说人话','收益','证据等级','来源','备注'];
function parseChapter(text, ch){
  const out=[];
  const parts = text.split(/^###\s+/m);
  for(let i=1;i<parts.length;i++){
    const p = parts[i];
    const head = p.split('\n')[0];               // “5. 标题”
    const m = head.match(/^(\d+)\.\s*(.+)$/); if(!m) continue;
    const body = p.slice(head.length);
    const tagm = body.match(/<!--\s*成本标签:\s*([^>]+?)-->/);
    const tag={};
    if(tagm) tagm[1].split(/[\s,，]+/).forEach(kv=>{
      const [k,v]=kv.split('='); if(k&&v) tag[k.trim()]=v.trim();
    });
    const e = {ch:ch.n, no:+m[1], title:m[2].trim(), chName:ch.name, safe:!!ch.safe,
               难受:tag['难受']||'', 时间:tag['时间']||'', 毅力:tag['毅力']||'',
               收益:tag['收益']||'', 口径:tag['口径']||'', grade:'', fields:{}};
    for(const f of FIELDS){
      const fm = body.match(new RegExp('^-\\s*'+f+'\\s*[:：]\\s*(.+)$','m'));
      if(fm) e.fields[f]=fm[1].trim();
    }
    e.grade = e.fields['证据等级']||'';
    out.push(e);
  }
  return out;
}

let ENTRIES=[];
const EN_QUERY = {

  messaging:'微信', online:'网上', dating:'恋爱', help:'求助', support:'求助', trust:'信任', comfort:'安慰', grief:'哀伤', child:'孩子', children:'孩子'
};
const EN_STOP = new Set(['a','an','the','i','me','my','we','you','how','do','does','to','for','with','about','is','are','can','should','what','when','and','or','in','on','of','please']);

/* ---------------- 状态与筛选 ---------------- */
const S = {q:'', chap:new Set(), grade:new Set(), tier:new Set(), ben:new Set(),
           scope:new Set(), dis:'', time:'', wil:''};

function costLE(val, sel){            // 成本按“低<高”排序，sel 是上限
  if(!sel) return true; if(!val) return false;
  const order={'0':0,'少':1,'中':2,'些':1,'多':3,'是':2,'否':0};
  return (order[val]??9) <= (order[sel]??9);
}
function match(e){
  if(S.chap.size && !S.chap.has(e.ch)) return false;
  if(S.grade.size && !S.grade.has(e.grade)) return false;
  if(S.tier.size && !S.tier.has(tierOf(e))) return false;
  if(S.ben.size && !S.ben.has(e.收益)) return false;
  if(S.scope.size && !S.scope.has(e.口径)) return false;
  if(!costLE(e.难受,S.dis)||!costLE(e.时间,S.time)||!costLE(e.毅力,S.wil)) return false;
  if(S.q){
    const hay=(e.title+' '+e.chName+' '+FIELDS.map(f=>e.fields[f]||'').join(' ')).toLowerCase();
    const words=(currentLang==='en'?S.q.toLowerCase().split(/\s+/).map(w=>EN_QUERY[w]||(EN_STOP.has(w)?'':w)):S.q.split(/\s+/)).filter(Boolean);
    if(!words.length||!words.every(w=>hay.includes(w.toLowerCase()))) return false;
  }
  return true;
}

/* ---------------- 渲染 ---------------- */
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  const t=UI[currentLang];

  h=h.replace(/(https?:\/\/[^\s）)。，、；]+)/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
  h=h.replace(/《高性价比人生指南》第\s*(\d+)\s*节/g,
    (m,n)=>'<a href="https://github.com/eternity4719/HowToLiveBetter#目录" target="_blank" rel="noopener">'+t.relatedChapter(n)+'</a>');
  h=h.replace(/第\s*(\d+)\s*章第\s*(\d+)\s*条/g,
    (m,c,n)=>'<span class="xref" data-ch="'+c+'" data-no="'+n+'">'+t.xref(c,n)+'</span>');
  return h;
}

  el.innerHTML='';
  items.forEach(([v,label])=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=label; b.classList.toggle('on',set.has(v));
    b.onclick=()=>{ set.has(v)?set.delete(v):set.add(v); b.classList.toggle('on'); render(); };
    el.appendChild(b);
  });
}
function refreshFilterRows(){
  const t=UI[currentLang];
  chipRow($('fChap'),CHAPTERS.map(c=>[c.n,currentLang==='en'?`Ch. ${c.n} · ${c.en}`:`${c.n} ${c.name}`]),S.chap);
  chipRow($('fGrade'),[['A','A'],['B','B'],['C','C']],S.grade);
  chipRow($('fTier'),[['极高',t.tiers['极高']],['高',t.tiers['高']],['一般',t.tiers['一般']],['安全优先',t.tiers['安全优先']]],S.tier);
  chipRow($('fBen'),[['大',t.benefits['大']],['中',t.benefits['中']],['小',t.benefits['小']]],S.ben);
  chipRow($('fScope'),Object.entries(t.scopes).map(([v,label])=>[v,label]),S.scope);
}
function applyLanguage(lang){
  currentLang=lang==='en'?'en':'zh';
  const t=UI[currentLang];
  document.documentElement.lang=currentLang==='en'?'en':'zh-CN';
  document.title=t.title;
  $('metaDescription').setAttribute('content',t.description);
  $('pageHeading').textContent=t.title;
  $('pageIntro').textContent=t.intro;
  $('languageNote').hidden=currentLang!=='en';
  $('languageNote').innerHTML='English interface. Book entries remain in Simplified Chinese. <a href="https://github.com/yuzhang-zhong/HowToGetAlong/blob/main/README.en.md">English overview</a> · <a href="https://github.com/yuzhang-zhong/HowToGetAlong/blob/main/docs/translation-guide.md">translation guide</a>.';
  $('notice').innerHTML=t.offline;
  $('q').placeholder=t.q;
  $('labelChapter').textContent=t.chapter; $('labelEvidence').textContent=t.evidence;
  $('labelTier').textContent=t.tier; $('clear').textContent=t.clear;
  $('labelBenefit').textContent=t.benefit; $('labelScope').textContent=t.scope;
  $('labelMaxCost').textContent=t.maxCost; $('labelDiscomfort').textContent=t.discomfort;
  $('labelTime').textContent=t.time; $('labelWillpower').textContent=t.willpower; $('costCap').textContent=t.costCap;
  [['cDis',['','0','少','中','多']],['cTime',['','0','少','中','多']],['cWil',['','否','些','是']]].forEach(([id,values])=>{
    const select=$(id);
    values.forEach((value,i)=>{select.options[i].textContent=i===0?t.unlimited:(t.costs[value]||value);});
  });
  $('footerCitation').textContent=t.citation; $('footerSiblingLabel').textContent=t.siblingLabel;
  $('footerSibling').textContent=currentLang==='en'?'High-Value Life Guide':'《高性价比人生指南》';
  $('footerSiblingNote').textContent=t.siblingNote; $('footerGlossaryLead').textContent=t.glossaryLead;
  $('footerGlossary').textContent=t.glossary; $('footerLicense').textContent=t.license;
  $('langZh').setAttribute('aria-pressed',currentLang==='zh'); $('langEn').setAttribute('aria-pressed',currentLang==='en');
  try{localStorage.setItem('relationship-guide-lang',currentLang);}catch{}
  $('langGroup').setAttribute('aria-label',currentLang==='en'?'Language':'语言');
  try{const url=new URL(location.href);if(currentLang==='en')url.searchParams.set('lang','en');else url.searchParams.delete('lang');history.replaceState({},'',url);}catch{}
  refreshFilterRows(); updateStats(); render();
}
function selBind(id, key){
  $(id).onchange=ev=>{ S[key]=ev.target.value; render(); };
}
function render(){
  const ui=UI[currentLang];
  const list=$('list'); list.innerHTML='';
  let n=0, lastCh=0;
  const frag=document.createDocumentFragment();
  for(const e of ENTRIES){
    if(!match(e)) continue; n++;
    if(e.ch!==lastCh){
      lastCh=e.ch;
      const h=document.createElement('h2'); h.className='chaphead';
      const chapter=CHAPTERS[e.ch-1];
      h.textContent=currentLang==='en'?`Chapter ${e.ch} · ${chapter.en}${e.safe?' '+ui.safeChapter:''}`:e.ch+'. '+e.chName+(e.safe?ui.safeChapter:'');
      frag.appendChild(h);
    }
    const t=tierOf(e);
    const card=document.createElement('div'); card.className='card'; card.id='e-'+e.ch+'-'+e.no;
    let tags='<span class="tag">'+ui.chapterTag(e.ch)+e.no+ui.itemTag+'</span>'
      +'<span class="tag g'+e.grade+'">'+(e.grade||'?')+'</span>'
      +'<span class="tag t-'+({ '极高':'ex','高':'hi','一般':'md','安全优先':'sf' }[t])+'">'+ui.tiers[t]+'</span>'
      +(e.口径?'<span class="tag">'+ui.scopes[e.口径]+'</span>':'')
      +(e.收益?'<span class="tag">'+ui.benefits[e.收益]+'</span>':'')
      +(e.难受?'<span class="tag">'+ui.discomfort+' '+ui.costs[e.难受]+'</span>':'')
      +(e.时间?'<span class="tag">'+ui.time+' '+ui.costs[e.时间]+'</span>':'')
      +(e.毅力?'<span class="tag">'+ui.willpower+' '+ui.costs[e.毅力]+'</span>':'');
    card.innerHTML='<h3>'+esc(e.title)+'</h3><div class="meta">'+tags+'</div>'
      +FIELDS.map(f=>e.fields[f]?'<div class="f"><span class="k">'+ui.fields[f]+'</span><span class="v">'+(currentLang==='en'?': ': '：')+fmt(e.fields[f])+'</span></div>':'').join('');
    frag.appendChild(card);
  }
  list.appendChild(frag);
  $('count').textContent= S.q||S.chap.size||S.grade.size||S.tier.size||S.ben.size||S.scope.size||S.dis||S.time||S.wil
    ? ui.countFiltered(n,ENTRIES.length) : ui.countAll(n);
}

function updateStats(){
  if(!ENTRIES.length){$('stats').innerHTML='';return;}
  const cnt={A:0,B:0,C:0,'极高':0,'高':0,'一般':0,'安全优先':0};
  ENTRIES.forEach(e=>{if(Object.hasOwn(cnt,e.grade))cnt[e.grade]++;cnt[tierOf(e)]++;});
  $('stats').innerHTML=UI[currentLang].stats(ENTRIES.length,cnt);
}

/* ---------------- 交叉引用弹层 ---------------- */
const pop=$('pop');
function findEntry(ch,no){ return ENTRIES.find(e=>e.ch===ch && e.no===no); }
document.addEventListener('click',ev=>{
  const x=ev.target.closest('.xref'); if(!x){ pop.style.display='none'; return; }
  const e=findEntry(+x.dataset.ch, +x.dataset.no);
  if(!e){ pop.textContent=UI[currentLang].missing; pop.style.display='block'; return; }
  pop.innerHTML='<div class="t">'+esc(e.title)+'</div>'
    +'<div>'+(e.fields['说人话']?esc(e.fields['说人话']):'')+'</div>'
    +'<div class="go"><span class="xref" data-ch="'+e.ch+'" data-no="'+e.no+'" data-jump="1">'+UI[currentLang].jump+'</span></div>';
  pop.style.display='block';
  const r=x.getBoundingClientRect();
  pop.style.left=Math.min(r.left, innerWidth-360)+'px';
  pop.style.top=Math.max(10, Math.min(r.bottom+8, innerHeight-160))+'px';
});
document.addEventListener('click',ev=>{
  const j=ev.target.closest('[data-jump]');
  if(!j) return;
  pop.style.display='none';
  ['chap','grade','tier','ben','scope'].forEach(k=>S[k].clear());
  S.q=''; $('q').value=''; S.dis=S.time=S.wil='';
  ['cDis','cTime','cWil'].forEach(id=>$(id).value='');
  document.querySelectorAll('.chip.on').forEach(b=>b.classList.remove('on'));
  render();
  const el=document.getElementById('e-'+j.dataset.ch+'-'+j.dataset.no);
  if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),2000); }
});

/* ---------------- 初始化 ---------------- */
refreshFilterRows();
$('langZh').onclick=()=>applyLanguage('zh'); $('langEn').onclick=()=>applyLanguage('en');
applyLanguage(currentLang);
$('q').addEventListener('input',ev=>{S.q=ev.target.value.trim(); render()});
selBind('cDis','dis'); selBind('cTime','time'); selBind('cWil','wil');
$('clear').onclick=()=>{
  S.q='';$('q').value='';['chap','grade','tier','ben','scope'].forEach(k=>S[k].clear());
  S.dis=S.time=S.wil='';['cDis','cTime','cWil'].forEach(id=>$(id).value='');
  document.querySelectorAll('.chip.on').forEach(b=>b.classList.remove('on')); render();
};

(async function(){
  let results;
  if(window.EMBEDDED){                       // 离线单文件版：构建脚本注入的数据
    results = window.EMBEDDED;
  } else {
    results = await Promise.all(CHAPTERS.map(c=>
      fetch(c.file).then(r=>r.ok?r.text():Promise.reject(c.file)).catch(()=>'')
    ));
  }
  let failed=0;
  CHAPTERS.forEach((c,i)=>{
    if(!results[i]){failed++;return;}
    ENTRIES=ENTRIES.concat(parseChapter(results[i],c));
  });
  if(failed) $('notice').classList.add('show');
  ENTRIES.sort((a,b)=>a.ch-b.ch||a.no-b.no);
  updateStats(); render();
})();
</script>
