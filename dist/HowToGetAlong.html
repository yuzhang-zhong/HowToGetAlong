6 条）。\n\n### 2. 只听声音，反而比看脸更准\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：无。\n- 说人话：反直觉但有用：识别对方的情绪，「只听声音」比「看脸+听声」更准——视觉信息会带偏你对语气的判断。吵架后的电话调解比视频对峙容易、也部分因为脸会让你解读出攻击性。文字读出的敌意一半是脑补（第 3 条），视频读出的脸色又一半是脑补——声音是被误读最少的信道。\n- 收益：五项实验：只听声音识别情绪的准确率高于看脸+听声（视觉通道干扰情绪判断）。\n- 证据等级：B\n- 来源：Kraus MW (2017). Voice-Only Communication Enhances Empathic Accuracy. American Psychologist 72(7). https://doi.org/10.1037/amp0000247\n- 备注：小样本实验、效应中等。与第 1 条互为支撑。\n\n### 3. 文字里读出的敌意，一半概率是脑补\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：下结论前多想一步。\n- 说人话：收到「行。」「知道了。」——你脑补出的阴阳怪气，大概率是脑补：实验里发件人自估能传对语气近八成，实际只有约五成六，只比瞎猜好一点。因为写的人脑子里有配乐，读的人只有字。别拿文字的语气当证据吵架；真想知道语气，问一句或打电话。\n- 收益：5 个实验：发件人自估语气传达正确率约 78%，实际约 56%（机会水平 50%）；误读源于「自我中心」——写的人读自己时自动脑补。\n- 证据等级：B\n- 来源：Kruger J, Epley N, Parker J, Ng Z (2005). Egocentrism over E-mail. JPSP 89(6). https://doi.org/10.1037/0022-3514.89.6.925\n- 备注：反过来用：自己写重要消息时，句号少用、语气词加上，把带宽手动补回来。\n\n### 4. 表情包也不是通用货币\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：确认对方的「用法表」。\n- 说人话：同一个笑脸，在苹果、安卓、微信各家长得不一样，同一个系统里不同人读出的意思也不一样：实验显示，人们对同一个表情符号判「积极/中性/消极」的分歧率约 25%，跨平台更大。长辈把微笑表情当友好、年轻人读成阴阳，两边都没错——是信道在偷换语义。要紧的话，用文字把语义钉死，表情只当装饰。\n- 收益：在线调查：对同一渲染的表情符号，「积极/中性/消极」判断分歧达 25%，跨平台渲染分歧更大。\n- 证据等级：B\n- 来源：Miller HJ, Thebault-Spieker J, et al. (2016). \"Blissfully Happy\" or \"Ready to Fight\". ICWSM. https://doi.org/10.1609/icwsm.v10i1.14757\n- 备注：跨平台渲染差异随平台统一在缩小，但使用分歧依旧。与第 3 条同源：文字信道带宽低。\n\n### 5. 对方已读不回，先别上升为「被无视」\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：等一等。\n- 说人话：消息发出去石沉大海，那种「被晾着」的感觉是真的——预注册的日记研究证实，无回复确实让人基本心理需要（归属、被认可）受威胁，这是普遍反应，不是你玻璃心。但「他故意无视我」到「他在开会/在开车/在陪娃」之间，证据不足以定罪。超不过一天的，别脑补；要紧的事直接打电话。\n- 收益：预注册日记研究（N=214）＋实验：消息无回复→基本心理需要受威胁、消极情绪上升。早期短信三人组实验同向。\n- 证据等级：B\n- 来源：Lutz B, et al. (2023). Media Psychology 26. https://doi.org/10.1080/15213269.2022.2101008 ；Smith CT, Williams KD (2004). Group Dynamics 8(4). https://doi.org/10.1037/1089-2699.8.4.291\n- 备注：与第 3 章第 7 条（要拒绝就明确拒绝）是一体两面：不回复的一方也在制造这种感受，能回就回一句。\n\n### 6. 共处时别低头刷手机——这条有两万人级的证据\n<!-- 成本标签: 难受=0 时间=0 毅力=些 收益=中 口径=关系质量 -->\n- 成本：改一个习惯。\n- 说人话：伴侣共处时刷手机（学名 phubbing）伤关系，这次不是拍脑袋：52 项研究、近 2 万人的荟萃里，phubbing 越多，关系满意度越低（r=−0.22），冲突越多（r=0.29），嫉妒越强（r=0.57）。跟第 1 章第 17 条（吃饭把手机收起来）配套执行。\n- 收益：元分析（52 研究/58 样本、N=19,698）：phubbing×关系满意度 r=−0.219（95%CI −0.26～−0.175）；×冲突 r=0.289；×嫉妒 r=0.573。\n- 证据等级：A\n- 来源：Nie J, et al. (2025). Frontiers in Psychology. https://doi.org/10.3389/fpsyg.2025.1561159\n- 备注：⚠ 分清两件事：「低头刷手机」（有真实证据）和「手机只摆在桌上」（著名 iPhone effect 研究——两项紧密重复均告失败、六研究荟萃「总体不支持」）——后者别当真。相关设计，因果未定。\n\n### 7. 别在社交媒体上「考古」伴侣或前任\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：忍住不点进去。\n- 说人话：翻伴侣点赞过的每个人、前任的新动态——考古带不来任何证据，只生产嫉妒：研究里社交媒体使用时长显著预测「Facebook 嫉妒」，而 phubbing 与嫉妒的相关高达 r=0.57。嫉妒一上身，行为变形（查岗、试探、冷战），关系损耗才开始真的发生。分手后的考古另有一害：见第 11 章第 13 条（刷前任与更高痛苦相关）。\n- 收益：横断问卷（N=308）：社交媒体使用时长显著预测 Facebook 嫉妒（控制人格与关系变量）。元分析：伴侣 phubbing×嫉妒 r=0.573。\n- 证据等级：B\n- 来源：Muise A, Christofides E, Desmarais S (2009). CyberPsychology & Behavior 12(5). https://doi.org/10.1089/cpb.2008.0263 ；Nie J, et al. (2025).（见第 6 条）\n- 备注：横断设计。想查证的猜疑（出轨、隐瞒）走现实渠道：直接问（第 3 章）、看该看的证据；考古不是取证，是自虐。\n\n### 8. 发不发合照、标不标「有伴」，别当感情体检表\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=心理健康 -->\n- 成本：少解读一点。\n- 说人话：「他不发我的照片」能吵三天。数据里的真相：发不发更多是依恋风格和个人习惯（焦虑型才偏爱高可见度），跟关系质量没有直接的因果链。58 对情侣的调查里倒是有两个小发现：女方用合照头像与双方满意度（边缘）正相关，而「因为社交平台状态吵架」本身与更低满意度相关——吵这件事比不发更伤。对齐一下「怎么对外展示」的偏好就行，别当忠贞测试。\n- 收益：58 对情侣配对数据：男方标注「有伴」→双方满意度（边缘）更高；女方用合照头像→更高；因社交平台状态吵架→女方满意度更低。另有研究：可见度行为由依恋风格预测（非因果）。\n- 证据等级：B\n- 来源：Papp JJ, Danielewicz J, Cayemberg C (2012). Cyberpsychology, Behavior, and Social Networking 15(2). https://doi.org/10.1089/cyber.2011.0291 ；Emery LG, et al. (2014). PSPB 40(11). https://doi.org/10.1177/0146167214549944\n- 备注：小样本、横断。替代指标见第 1 章（回应好消息、感谢、手机收起来）——那些才是真体检表。\n\n### 9. 道歉能打字，但分事情轻重\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：想十秒用哪个信道。\n- 说人话：道歉的信道有讲究：三个实验发现，「诚信型」过错（撒谎、失信）文字道歉反而更有效——对方可以按自己节奏反复读；「能力型」过错（搞砸了事）口头当面更有效。原则记法：越伤信任的越宜书面（郑重、可回看），越「办砸事」的越宜当面（有温度）。小道歉别用大阵仗，大道歉别只发表情包。\n- 收益：3 个实验：诚信型信任违背时书面道歉更有效、能力型违背时口头道歉更好。\n- 证据等级：B\n- 来源：Gao Z, Yan J (2022). Frontiers in Psychology 13:884867. https://doi.org/10.3389/fpsyg.2022.884867\n- 备注：⚠ 信任修复情景的实验，外推到亲密关系日常道歉需谨慎。道歉的成分清单见第 3 章第 4 条——信道是次要的，认账是主要的。\n\n### 10. 开摄像头开会，比你想的累\n<!-- 成本标签: 难受=0 时间=0 毅力=些 收益=小 口径=时间精力 -->\n- 成本：跟团队定个规则。\n- 说人话：一直开摄像头的视频会比线下会更耗人（自我镜像、近距离凝视、动不了），现场实验证实：开会开摄像头显著增加疲劳，女性更强。不是反对视频，是给关系留带宽：长会尽量中间歇；例行沟通可以不开摄像头（走路开会）；1 对 1 想聊好，参照第 1 条升级语音或约线下。\n- 收益：被试内现场实验：开会开摄像头→疲劳显著增加，效应女性更强。后续研究定位了非言语机制（镜像自看、近距离注视、活动受限）。\n- 证据等级：B\n- 来源：Shockley KM, et al. (2021). JAP 106(8). https://doi.org/10.1037/apl0000948\n- 备注：「Zoom 疲劳」概念本身出自理论文章（Bailenson 2021），实证是这篇及后续。远程办公的关系维护见第 6 章第 10 条。\n\n### 11. 线上吵架：别用文字把火越吵越大\n<!-- 成本标签: 难受=少 时间=0 毅力=些 收益=中 口径=关系质量 -->\n- 成本：换信道的那一下克制。\n- 说人话：文字吵架有两个放大器：语气全靠脑补（第 3 条：一半概率读错），线上又比面对面少顾忌（隔着屏幕，说话更狠——「线上去抑制」，这个机制是临床理论、证据等级 C）。火上来了别在群里和私聊里对轰：参照第 2 章第 1 条叫暂停，约好时间打电话或见面谈。文字只用来约时间。\n- 收益：文字语气误读的实验证据见第 3 条（B）；线上去抑制效应为理论文献（C，无直接数据）。\n- 证据等级：C\n- 来源：Suler J (2004). The Online Disinhibition Effect. CyberPsychology & Behavior 7(3). https://doi.org/10.1089/1094931041291295 ；Kruger et al. (2005).（见第 3 条）\n- 备注：这条的做法（换信道+暂停）本身是经验做法（C），配套硬证据是第 3 条和第 1 条。只听声音更准（第 2 条）在电话调解里也帮忙。\n\n### 12. 给远方父母装好视频通话，教会他们用\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：装 App、教几遍、置顶联系人。\n- 说人话：视频对老人有用：10 项研究的荟萃里，视频会议类干预提升了老年人的社会支持感、降低孤独和抑郁。它顶不上见面（第 7 章第 1 条：只有面对面独立预测抑郁率），但比纯电话强在能看见脸。教的时候：桌面放快捷方式、写一张步骤纸条，教会重启后怎么再打开。\n- 收益：视频会议干预荟萃（10 项研究）：提升社会支持、降低孤独与抑郁。机制性孤独干预荟萃（31 项研究、35 个 RCT）同向。\n- 证据等级：A\n- 来源：Archives of Gerontology and Geriatrics (2025). https://www.sciencedirect.com/science/article/pii/S0197457225001600\n- 备注：机构养老样本效应更大、社区老人证据质量中等（既有荟萃结论不完全一致——如实说「证据中等，方向一致」）。防老人被骗账号见《高性价比人生指南》第 14 节。\n","# 10. 反面清单\n\n流行但证据不足的关系说法。这一章不否定感受，只核对证据——凡「查无实据」的，标出来，把钱和时间省下。反面条目的证据等级标的是「反驳证据」的强度。口径：时间精力、金钱、关系质量、心理健康。\n\n### 1. 「对的人」不存在：灵魂伴侣信念的坑\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：换一套预期。\n- 说人话：相信「命中注定、对的人一出现就顺」的宿命论，在数据里表现不佳：宿命信念强的人，关系初期一有不满就更想分手（「不对的人，早散早好」）、压力下更用回避应对、为结束担的责任更少。四年纵向研究补一刀：浪漫信念跟当时的满意度正相关，但**不预测**关系能不能走过四年。相信「关系是练出来的」成长论，才是能用的信念。\n- 收益：情侣纵向研究：宿命信念→初期不满更易分手、压力下更用回避应对；成长信念→维护型应对。4 年纵向（N 未知）：浪漫信念与当时的爱/满意/承诺正相关，但不预测 4 年存续，且随时间递减。\n- 证据等级：B\n- 来源：Knee CR (1998). Implicit Theories of Relationships. JPSP 74(2). https://doi.org/10.1037/0022-3514.74.2.360 ；Sprecher S, Metts S (1999). JSPR 16(6). https://doi.org/10.1111/j.1475-6811.1999.tb00207.x\n- 备注：反面条目。与第 2 条（心有灵犀期待）是一对儿。\n\n### 2. 「心有灵犀不用我开口」是吵架的原料\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：把话说出口。\n- 说人话：「爱我就该知道我在想什么」——关系信念量表里专门有个「读心期待」分量表，它属于经典的一组「非理性关系信念」：实证发现持这类信念越多（尤其不安全依恋者），满意度越低。对方猜不中你的心思，不是爱的缺陷，是人类心理的默认配置。配套解药在本章之外：第 3 章的「开口」整套都是为治这条准备的。\n- 收益：年轻情侣问卷：不安全依恋者更多非理性关系信念（含读心期待）→满意度更低；女性更认可「表达分歧有风险」「伴侣不会变」。读心信念的原始锚点为关系信念量表。\n- 证据等级：B\n- 来源：Eidelson RJ, Epstein N (1982). JCCP 50(5). https://doi.org/10.1037/0022-006X.50.5.716 ；Stackert RA, Bursik K (2003). PAID 34(8). https://doi.org/10.1016/S0191-8869(02)00124-1\n- 备注：反面条目。「主动开口被低估」的错位家族见第 3 章。\n\n### 3. 别拿 MBTI 当择偶筛子\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=时间精力 -->\n- 成本：零。\n- 说人话：「INTJ 配 ENFP 天作之合」——这套说法没有任何合格的证据支撑：测本身的效度被综述评价为「证据不足」（重测几周后约一半人的类型分类会变），「类型匹配预测关系质量」连像样的支持研究都找不到。把它当聊天话题行，当筛选器、当分手理由，是拿掷硬币决定人生。\n- 收益：量表效度综述：重测研究显示约半数受试者数周后类型分类改变；结论为证据不足以支持其效用与主张。「类型匹配与关系质量」：未找到合格支持研究（仅有的小样本为阴性或混合）。\n- 证据等级：B\n- 来源：Pittenger DJ (1993). The Utility of Myers-Briggs Type Indicator. Review of Educational Research 63(4). https://doi.org/10.3102/00346543063004467\n- 备注：人格本身影响关系（见第 4 条），错的是「四字母分类」这套测量和配对学。付费 MBTI 测评、配对咨询，省下。\n\n### 4. 「五种爱语」当词汇表可以，当处方不行\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：零。\n- 说人话：「找到彼此的爱语，关系就好了」听着工整，证据不跟：预注册研究（499 名长期同居者）发现，不足半数的人有可辨识的「主要爱语」；「按对方爱语表达」并不比其他体贴行为更能预测关系质量；真正关联更强的，是**多元灵活的表达**——五种都会使的人，比「找对那一种」的人过得好。框架可当谈资（帮两人聊「什么让你感觉被爱」），别当标准答案。\n- 收益：预注册横断研究（N=499）：主要爱语的辨识率不足半数；按对方爱语表达不比其他行为更能预测关系质量；多元灵活表达关联最强。系统评估：三大核心假设（每人一种、恰五种、匹配更幸福）均无强实证。\n- 证据等级：B\n- 来源：Flicker S, Sancier-Barbosa F, Impett EA (2025). JMFT 51(4). https://doi.org/10.1111/jmft.70078 ；Impett EA, Park Y, Muise A (2024). Current Directions in Psychological Science 33(2). https://doi.org/10.1177/09637214231217663\n- 备注：替代框架：伴侣响应性（第 1 章第 4 条，对好消息的回应）——证据硬得多。\n\n### 5. 「5:1 神奇比例」没有独立重复\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=时间精力 -->\n- 成本：别照本宣科。\n- 说人话：「夸五句才能批评一句」流传极广。原始研究是真的（稳定夫妻冲突中的正负互动确实约 5:1），但把 5:1 当**分界线**用——「我们家今天夸够了没」——没有独立重复支持。历史教训就在旁边：另一个著名的「积极率」（Losada 3:1）被数学家证伪了模型。正确姿势：方向照做（多正少负），比例别数。\n- 收益：原始出处为 1998 年新婚夫妻纵向研究；「5:1 作为普适分界线」的直接独立重复未找到。旁证：Losada 3:1 的数学模型已被公开证伪。\n- 证据等级：B\n- 来源：Gottman JM, Coan J, Carrère S, Swanson C (1998). JMF 60(1). https://doi.org/10.2307/353438 ；Brown NJL, Sokal AD, Friedman HL (2013). American Psychologist 68(9). https://doi.org/10.1037/a0034443\n- 备注：这是「原始研究 A、流行用法无据」的典型。真要数什么，数蔑视出现的次数（第 2 章第 3 条）——那个毒。\n\n### 6. 性格「相似」或「互补」对幸福的贡献接近零\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=时间精力 -->\n- 成本：省下配对焦虑。\n- 说人话：「我们太像了不合适」「正好互补」——两个说法在数据里都几乎站不住：三国两万多名已婚者的大样本里，你自己的性格解释关系满意度方差的 6–15%，伴侣的性格占 1–3%，而**夫妻相似性连 0.5% 都不到**。选人纠结「像不像」，不如看第 1 章、第 2 章那套可操作的日常指标。\n- 收益：三国全国代表性已婚样本（澳 5,278、英 6,554、德 11,418）：本人人格解释满意度方差 6–15%；伴侣效应 1–3%；夫妻相似性 <0.5%。互补假说同样无支持。\n- 证据等级：A\n- 来源：Dyrenforth PS, Kashy DA, Donnellan MB, Lucas RE (2010). JPSP 99(4). https://doi.org/10.1037/a0020385\n- 备注：教育相当确实更稳（第 8 章第 14 条）——那是行为与生活方式层面的重叠，跟人格「相似」两码事。\n\n### 7. 「从不吵架的夫妻最幸福」不是健康关系的样子\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：放下一个假标准。\n- 说人话：Gottman 的夫妻分型里，长期稳定且满意的有三种：验证型（好好吵）、**易变型（吵得又频又烈但修复得好）**、回避型（绕开冲突）。高冲突的夫妻可以又稳又满意——决定性的是吵法（第 2 章），不是吵不吵。拿「从不吵架」当目标，练出来的多半是回避和积压。\n- 收益：纵向观察的夫妻分型：三种稳定类型（验证型、易变型、回避型），高冲突的易变型可稳定且满意；方式比频率重要。\n- 证据等级：B\n- 来源：Gottman JM (1993). JCCP 61(1). https://doi.org/10.1037/0022-006X.61.1.6\n- 备注：Gottman 自家样本、规模有限。「吵架吵出事」的红线照旧存在：第 2 章第 3 条的蔑视、第 4 章的暴力。直接检验「频率与稳定」的荟萃未找到（如实说明）。\n\n### 8. 「吵架不过夜」：没有直接证据，睡眠倒有\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：省一句口号。\n- 说人话：「当天解决」的军规没有直接检验（没找到比较「当天解决 vs 冷却过夜」的研究）；现有证据反而部分站在睡觉这边：第 2 章第 8 条——睡得差的一方第二天挑更多冲突、共情更差。硬要熬夜吵完，常常是带着坏睡眠把架吵得更糟。务实的版本：定好「明天 X 点接着谈」的暂停（第 2 章第 1 条），比硬撑到半夜强；道歉的时机也宜晚不宜急（第 2 章第 12 条）。\n- 收益：直接检验未找到（如实标注）。替代证据：睡眠与冲突的双研究（Gordon & Chen 2014）。\n- 证据等级：C\n- 来源：经验说法的证据核查；替代见 Gordon AM, Chen S (2014). SPPS 5(2). https://doi.org/10.1177/1948550613488952\n- 备注：反面条目——「不过夜」的合理内核是「别积压」，实现方式不必是熬夜。\n\n### 9. 「七年之痒」正在变「五年之痒」\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：无。\n- 说人话：拿 1.6 万对初婚夫妻数据算离婚风险随婚龄的分布：整体峰值确实在婚后第 7 年附近——「七年之痒」有统计原型。但更有信息量的是趋势：越年轻的队列峰值越早，1980 年代结婚的约 11 年，1990 年代约 8 年，2000 年代已经缩到 5–6 年。它不是宿命表，是风险窗口的知情：头几年恰恰是第 8 章第 12、13 条（婚前教育、满意度下滑期）该用力的时候。\n- 收益：CFPS 2010，16,472 对初婚夫妻：离婚风险随婚龄倒 U 型，总体峰值≈婚后第 7 年；1980–89 队列约 11 年、1990–99 约 8 年、2000–10 约 5–6 年（峰值前移）。\n- 证据等级：A\n- 来源：许琪、邱泽奇、李建新 (2015).《社会学研究》2015 年第 5 期. https://ir.pku.edu.cn/handle/20.500.11897/444081\n- 备注：样本仅 3.6% 离过婚；作者指出「七年之痒」很大程度是总体异质性的混合结果。民政部公报不按婚龄公布，此为最佳替代来源。\n\n### 10. 「男人女人来自不同星球」在数据上是错的\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：少用一个借口。\n- 说人话：「男人就是不懂」「女人天生想太多」——这套流行叙事的数据基础是空的：汇总 46 项元分析、124 个心理性别效应，78% 是小到接近零（d≤0.35）。两性的心理共同点远大于差异。把「沟通不畅」归因于性别，等于放弃了具体原因（第 2、3、9 章那些可修的东西）——还顺手给对方判了个「不可理喻」的无期徒刑。\n- 收益：性别相似性假说：汇总 46 项元分析，124 个效应量中 78% 为小或接近零（d≤0.35）。\n- 证据等级：A\n- 来源：Hyde JS (2005). The Gender Similarities Hypothesis. American Psychologist 60(6). https://doi.org/10.1037/0003-066X.60.6.581\n- 备注：少数大差异真实存在（扔掷距离等），别推向「一切无差」。「沟通不良的原因清单」见第 9 章第 3 条（语气误读）、第 2 章第 1 条（生理淹没）。\n\n### 11. 「情商比智商重要」：数据上只是「有点用」\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=时间精力 -->\n- 成本：少交一门课的学费。\n- 说人话：情商培训市场把它吹成人生总开关，荟萃给的刻度小得多：三个流派的情商测量与工作绩效的校正相关只有 .24–.30，**控制智商和大五人格后，增量预测力很小**（能力型最小）。「EQ 完胜 IQ」是营销话术；在关系里，可用的替代品是可练的具体技能——第 1 章的回应、第 2 章的吵法、第 3 章的开口，每一样都比「提升情商」具体。\n- 收益：三流派 EI 荟萃：EI 与工作绩效校正相关 .24-.30；控制智商与大五后增量效度小（能力型最小）。「更重要」不成立，实为有小幅独立预测力。\n- 证据等级：A\n- 来源：O'Boyle EH, et al. (2011). The Relation Between Emotional Intelligence and Job Performance. Journal of Organizational Behavior 32(5). https://doi.org/10.1002/job.714\n- 备注：反面条目。注意结论是「增量小」不是「完全无用」。\n\n### 12. 分房睡不是感情出问题的证据\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：少一个莫须有的判断。\n- 说人话：因打鼾、作息而分房睡，比想象中常见——美国睡眠调查里约三分之一的夫妇至少偶尔「睡眠离婚」，主因就是打鼾和作息差。「分房=感情破裂」没有证据；「分房改善关系」也没有（机构调查，非期刊，无纵向因果数据）。睡不好的代价是实打实的（第 2 章第 8 条），感情温度靠醒着的时候补（第 1 章）。怎么选都行，别互相定罪。同床的生理红利与干扰的并存账，见第 17 章第 8 条。\n- 收益：机构调查（n=2,005 美国成人）：约 35% 夫妇至少偶尔分房，主因打鼾/作息；2024 年波次为 29%（措辞有变，不可比）。分房与关系质量两个方向的因果证据均无。\n- 证据等级：C\n- 来源：American Academy of Sleep Medicine (2023). Sleep Prioritization Survey. https://aasm.org/wp-content/uploads/2023/07/sleep-prioritization-survey-2023-sleep-divorce.pdf\n- 备注：机构调查、因果未证，按 C 如实标。睡眠对关系的影响反而是硬证据——见第 2 章第 8 条。\n\n### 13. 「数到十」没有直接证据，但「发泄」有反证\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=关系质量 -->\n- 成本：选对冷静方式。\n- 说人话：吵架「先数到十」——直接检验这个做法的研究找不到。但它的邻居有数据：实验里，被激怒后**反刍和发泄**的人愤怒和攻击性不降反升，分心（干点别的）的人最低。所以「暂停+离开现场+干别的」（第 2 章第 1 条）有依据，「原地憋着数数」和「狠狠发泄」都别指望。\n- 收益：实验：愤怒后反刍/宣泄组攻击性最高，分心组最低。Gottman「淹没后需 20 分钟」为书级建议（见第 2 章第 1 条备注）。「数到十」的直接检验：未找到。\n- 证据等级：B\n- 来源：Bushman BJ (2002). Does Venting Anger Feed or Extinguish the Flame? PSPB 28(6). https://doi.org/10.1177/0146167202289013\n- 备注：祛魅条目——冷却是方向（分心优于宣泄），具体口诀别当圣旨。\n\n### 14. 别把「看透对方」当成熟：适度的滤镜是好的\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：留着那层滤镜。\n- 说人话：流行的「成熟爱情观」爱说「爱一个人要爱真实的他，别美化」——数据不全支持：经典研究发现，把伴侣**理想化**（往好了想）的人，关系满意度更高，而且这种适度错觉是满意关系的普遍特征；理想化与满意度互相喂养。这不等于自欺到看不见红旗（第 4 章的红线照旧生效）；是别把「祛魅」当成长——多数关系的燃料本来就是有点放大的对方。\n- 收益：已婚＋恋人双方自评/评伴侣/评典型与理想伴侣的路径分析：理想化预测更高满意度；适度错觉是满意关系的特征。\n- 证据等级：B\n- 来源：Murray SL, Holmes JG, Griffin DW (1996). The Benefits of Positive Illusions. JPSP 70(1). https://doi.org/10.1037/0022-3514.70.1.79\n- 备注：路径分析、样本量在正文（未核）。这条与第 1 条（灵魂伴侣）互为反面：祛魅式「清醒」和宿命式「注定」都不是好杠杆，可操作的成长信念才是。\n\n### 15. 「家暴受害者平均挨 35 次才求助」：查无出处\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=人身安全 -->\n- 成本：别用这句话劝人。\n- 说人话：这条流传极广的「联合国数据」，核查结果是查无出处：英国内政部一份报告引用过但未注明来源，事实核查机构也没能溯源到原始研究。它被广泛用于劝受害者「早点求助」——出发点好，代价是给受害者又压了一层「你拖太久了」的道德账。真正有用的说法在第 4 章：求助早晚没有及格线，准备和证据（第 4 章第 13 条）才是该操心的。\n- 收益：核查结论：无原始研究支撑（英国内政部 2011 报告引而未注源；Full Fact 溯源失败；中文流传的「联合国数据」查无出处）。\n- 证据等级：C\n- 来源：Full Fact (英) 事实核查机构（origin 未溯源，2011 年英国内政部报告为最早可查的引用）. https://fullfact.org\n- 备注：反面条目。真实的求助门槛证据：WHO 多国研究显示大量受害从未向官方求助（见第 4 章第 8 条备注）——方向支持「别苛责求助晚」，只是没有那个具体数字。\n\n### 16. 别给任何人贴「NPD」「煤气灯」的标签\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：管住诊断欲。\n- 说人话：短视频看多了，人人都会几句「自恋型人格」「煤气灯操纵」。作为普通人的用法，这些词几乎只有坏处：给自己「他是坏人」的结论就不用再看证据了；给对方贴上就不再沟通了。真正有用的动作是记录行为（「他说我没说过 X，有录音」）和求助专业评估（第 4 章第 15 条）。人格诊断是精神科医生的活，不是评论区网友的。\n- 收益：无支持证据——「网络人格诊断改善关系」的任何研究均不存在；临床标签的使用本身有专门训练与伦理边界。\n- 证据等级：C\n- 来源：概念澄清（对应用户高频提问）；行为记录与求助路径见第 4 章第 5、15 条。\n- 备注：这条放在反面清单的原因：它是当下传播最广的「民间诊断术」。被持续否认感受、分不清自己记性的——那不是你先贴标签的理由，是先找专业帮助的理由（12356）。\n","# 11. 关系结束之后\n\n分手、离婚、丧偶、绝交——关系的结束伤害身体，也有一套恢复的规律和法律流程。前半章讲身心，后半章讲中国现行法下的离婚程序与待遇。口径：寿命、心理健康、金钱、人身自由。\n\n### 1. 心碎不是比喻：丧亲 24 小时内心梗风险飙升\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=大 口径=寿命 -->\n- 成本：知道这件事。\n- 说人话：至亲去世的头一天，心梗风险是平时的 21 倍——这不是修辞，是 2,000 名心梗患者的病例交叉研究。风险逐日递减，而且绝对值不高（低危人群约 1394 人里 1 例、高危约 320 人里 1 例）。该做的：巨大打击后的头几天，别独自硬扛、别提重物，胸口疼、气短立刻就医（120），别「忍到明天」。\n- 收益：病例交叉研究（1,985 例心梗患者）：亲人死亡后 24 小时内心梗风险 21.1 倍（95%CI 13.1–34.1），逐日递减；绝对风险：低危每 1,394 人 1 例、高危每 320 人 1 例。\n- 证据等级：A\n- 来源：Mostofsky E, et al. (2012). Circulation 125(3). https://doi.org/10.1161/CIRCULATIONAHA.111.061770\n- 备注：同样机制下有「心碎综合征」（应激性心肌病，国际注册 1,750 例中 89.8% 为女性）——可恢复但住院并发症率与心梗相近，别当小病。头一个月的心血管窗口与原书第 29 节（遭遇重大打击之后）互参。\n\n### 2. 丧偶头半年是健康高危期\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=大 口径=寿命 -->\n- 成本：头几个月里，身边人不把「劝节哀」当全部工作。\n- 说人话：226 万人的荟萃给出「鳏寡效应」的量级：丧偶后不到 6 个月，死亡风险高约四成（RR 1.41）；过了半年降到 1.14；男性风险高于女性。头几月该做的：吃饭睡觉有人盯、慢病药有人管（忘吃降压药在这窗口里很致命）、重大决定（搬家、卖房）往后放。头七过后才是照顾的开始，不是结束。\n- 收益：15 个前瞻队列、226 万人的荟萃：丧偶后 <6 个月 RR=1.41（1.26–1.57）；≥6 个月 1.14（1.10–1.18）；男 1.23、女 1.04。\n- 证据等级：A\n- 来源：Moon JR, Kondo N, Glymour MM, Subramanian SV (2011). PLoS ONE 6(8). https://doi.org/10.1371/journal.pone.0023465\n- 备注：对照《高性价比人生指南》第 29 节（丧偶后的半年）。丧偶后的钱：公积金余额、丧葬补助金、抚恤金怎么领，见第 23 条与原书第 25 节。\n\n### 3. 丧偶后的社交：先涨后落，别让它落空\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=中 口径=心理健康 -->\n- 成本：趁第一年的「帮扶潮」重建日常。\n- 说人话：荷兰前瞻队列给丧偶者的社交画了条曲线：丧偶后子女和手足的接触、支持先上升（大家涌来帮忙），约两年半后回落——而这时候「幸存者自己」的网络如果没接上，回落就是真空。丧偶头一两年该做的不是谢绝好意，是把这些接触**制度化**：固定的每周一次家宴、接手老伴的某个固定活动（那个球局、那个合唱团）。落空期的对照解药见第 5 章。\n- 收益：LASA 前瞻队列（227 丧偶＋408 已婚老人，1992-2002）：丧偶后与子女/同胞的接触和支持上升（子女、同胞最明显），约 2.5 年后回落——「暂时强化后收缩」。\n- 证据等级：B\n- 来源：Guiaux M, van Tilburg T, Broese van Groenou M (2007). Personal Relationships 14(3). https://doi.org/10.1111/j.1475-6811.2007.00165.x\n- 备注：观察性队列。遗属的再婚选择与边界见第 17、18 条。\n\n### 4. 被拒绝的痛，大脑按「真的疼」处理\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：知道这件事。\n- 说人话：失恋说「心碎」也生理成立：功能磁共振里，看前任照片回想被拒绝，激活的脑区与手臂热痛激活的重叠（次级体感皮层、背侧后岛叶）。难受不是矫情，是神经系统正经八百的疼——所以别用「这点事至于吗」对自己，按对待疼痛的办法对待：休息、进食、别加班硬撑。\n- 收益：fMRI 同批被试内比较（看前任照片 vs 前臂热痛）：激活区域重叠，对疼痛研究的阳性预测值最高 88%。\n- 证据等级：B\n- 来源：Kross E, Berman MG, Mischel W, Smith EE, Wager TD (2011). PNAS 108(15). https://doi.org/10.1073/pnas.1102693108\n- 备注：小样本神经影像（约 40 人），结论方向被广泛引用。心理症状持续加重的，见第 8 条。\n\n### 5. 哀伤没有标准时间表，「五阶段」不是路标\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：放下「该走完五个阶段」的预期。\n- 说人话：Kübler-Ross 的「否认→愤怒→讨价还价→抑郁→接受」流传最广、证据最弱。233 名丧亲者的两年追踪：接受度从一开始就最高，「想念」才是主导的负面感受，各种情绪的峰值都出现在头 6 个月内；且个体轨迹差异极大——另一项前瞻研究里，**韧性（不太受影响）才是最常见的轨迹**，不是「大病一场」。没有时间表，也没有标准剧本；别人没按剧本走，别催；自己没按剧本走，别怕。\n- 收益：Yale 丧亲研究（N=233，丧后 1–24 个月）：接受度始终最高、思念（yearning）为主导负面指标；峰值：否认 1 月、思念 4 月、愤怒 5 月、抑郁 6 月，接受持续上升。前瞻研究（N=205）：五条轨迹中韧性最常见、普通哀伤轨迹并不常见。\n- 证据等级：B\n- 来源：Maciejewski PK, Zhang B, Block SD, Prigerson HG (2007). JAMA 297(7). https://doi.org/10.1001/jama.297.7.716 ；Bonanno GA, et al. (2002). JPSP 83(5). https://doi.org/10.1037/0022-3514.83.5.1150\n- 备注：⚠ 准确表述：该研究发现五个指标的达峰顺序与阶段论「部分吻合」，但**不支持**离散阶段与必然序列——别写成「彻底证伪」。持续走不出来的判定见第 8 条。\n\n### 6. 周年反应是真的，但比想象中短暂\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：提前给日子做标记。\n- 说人话：忌日、生日、节日前后，丧亲者的痛苦确实会加重——前瞻概率样本显示这种「周年反应」真实存在，但**集中在丧后头 6 个月内的节点**，到 18 个月随访时已消失。给第一年的忌日、生日做提前安排（有人陪、有事做），是低成本的缓冲；第二年起，多数日子已经不咬人。矛盾的数据也有（瑞典女性忌日自杀风险升高 vs 丹麦全登记未升高），如实说：个体差异大，第一年别独处。\n- 收益：CLOC 前瞻概率样本：忌日、配偶生日、节后期等痛苦升高——仅限丧后头 6 个月，18 个月随访时消失。瑞典全人群 case-crossover：女性忌日至后 2 天自杀 OR=1.67（男性 0.57）；丹麦全登记：忌日/生日自杀自伤未升高（IRR 1.00-1.04）。\n- 证据等级：B\n- 来源：Carr D, Sonnega J, Nesse RM, House RJ (2013). J Gerontol B 69B(1). https://doi.org/10.1093/geronb/gbt061 ；Grotta A, et al. (2023). JAMA Netw Open 6(4). https://doi.org/10.1001/jamanetworkopen.2023.6951\n- 备注：结论「真实但短暂、个体差异大」。头一年之外周年反应仍强烈的，按第 8 条评估。\n\n### 7. 安慰丧亲的人：别劝「想开」，递耳朵\n<!-- 成本标签: 难受=少 时间=少 毅力=否 收益=中 口径=心理健康 -->\n- 成本：一句对的问候。\n- 说人话：什么安慰有用、什么有害，有调查数据：94 名丧亲者（丧后 4-7 年）的评价——**有用**的是接触有同样经历的人、有机会表达感受；**有害**的是劝勉打气式回应（「往好处想」「他解脱了」）。更扎心的佐证：吊唁卡上最常见的话术，恰是丧亲者认为最无益的那类。模板：说具体（「他上次帮我……我一直记得」）＋在场（陪着就行）＋留口子（「过阵子我再来」）。不知道说什么时，闭嘴陪着就是对的。\n- 收益：94 名丧偶/丧子者评价支持行为：有用=与同经历者接触、表达感受；有害=劝勉打气。170 张吊唁卡的话语分析：「悲伤只该持续几天」类信息被评无益。\n- 证据等级：B\n- 来源：Lehman DR, Ellard JH, Wortman CB (1986). JCCP 54(4). https://doi.org/10.1037/0022-006X.54.4.438 ；Calderwood KA, Alberton D (2022). Omega. https://doi.org/10.1177/00302228211065958\n- 备注：被安慰的一方：可以直说「我不需要建议，就想有人听」。\n\n### 8. 约十分之一的丧亲者走不出来——那是病，能治\n<!-- 成本标签: 难受=少 时间=中 毅力=是 收益=大 口径=心理健康 -->\n- 成本：挂号与疗程。\n- 说人话：多数人会缓过来，但约 10% 的丧亲者发展成「延长哀伤障碍」（PGD，已列入国际疾病分类）：一年后仍被想念吞没、功能受损。它不是「太脆弱」，是一种可治的病：两个随机试验——2005 年那个 16 次治疗有效率 51%（对照 28%）；2014 年的更新版应答率 70.5%（对照 32.0%，NNT 2.56）。判别线粗略地说：过了半年一年仍在原地打转、生活瘫痪的，去挂精神科/心理科，不是去扛。\n- 收益：14 项研究荟萃：PGD 患病率 9.8%（95%CI 6.8–14.0）。RCT（N=95，2005）：复杂哀伤治疗 51% vs 人际治疗 28%（NNT 4.3）。RCT（N=151，2014）：应答率 70.5% vs 32.0%（RR 2.20，NNT 2.56）。ICD-11 收录 PGD（2022 年生效）。\n- 证据等级：A\n- 来源：Lundorff M, et al. (2017). J Affect Disord 212. https://doi.org/10.1016/j.jad.2017.01.030 ；Shear MK, et al. (2005). JAMA 293(21). https://doi.org/10.1001/jama.293.21.2601 ；Shear MK, et al. (2014). JAMA Psychiatry 71(11). https://doi.org/10.1001/jamapsychiatry.2014.1242\n- 备注：热线先打 12356（第 4 章第 19 条）；挂号路径见《高性价比人生指南》第 24 节。因自杀丧亲的（幸存者内疚与污名双重打击），参照原书第 29 节。\n\n### 9. 丧亲之后的工作：允许自己降速\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=中 口径=金钱 -->\n- 成本：跟上级谈一次。\n- 说人话：丧亲后「赶紧回岗位忙起来忘掉」是常见处方，数据不站在「满负荷」这边：登记队列显示丧亲者非就业概率显著升高，在职者的注意与产出也需要缓冲期（工作绩效的系统研究缺失，如实说明——丧假长度的研究都没有）。务实做法：回去前跟上级谈好过渡安排（头几周减量、关键节点留弹性）；法定丧假很短，但人情和绩效上「硬扛提前满血」对双方都不划算。\n- 收益：挪威登记队列（父母自杀丧亲者）：丧亲时非就业概率 OR=1.14（1.05-1.23），2 年及 5 年后仍约 1.13。工作绩效的系统研究基本空白；丧假长度无同行评审研究（如实标注）。\n- 证据等级：B\n- 来源：BMJ Open 2022;12(9):e064379.\n- 备注：C 部分如实标注。丧假的现行天数与工资口径查当地规定（属劳动规章，本轮未核）。\n\n### 10. 想走出一段感情，把「他的缺点」写下来\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：写的时候确实难受。\n- 说人话：脑电实验测过这条民间偏方：对前任做「负面重评」（回想他不好的地方、这段关系的问题）确实能降低残留的爱慕和迷恋。代价是当下情绪更糟；「想开心的事」舒服些，但爱意不降。所以分两种用法：忍不住想复合、需要「降温」的时候，用负面重评；平时缓情绪，用分心和照顾自己。工具没有哪个是全能的。\n- 收益：EEG 实验：指示性「下调」降低主观迷恋与依恋感；对前任负面重评降低爱意但情绪更不愉快；分心提升愉悦但不降爱意。\n- 证据等级：B\n- 来源：Langeslag SJE, van Strien T (2016). PLoS ONE 11(8). https://doi.org/10.1371/journal.pone.0161087 ；Langeslag SJE, Sanchez M (2018). JEP: General 147(5). https://doi.org/10.1037/xge0000360\n- 备注：小样本 EEG 研究。别升级成「天天恨他」——长期反刍反而升高负面情绪（见第 10 章第 13 条）。\n\n### 11. 写下来，往好处写：分手后的正向书写\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：每天十几分钟、写几天。\n- 说人话：分手后写日记有实验证据，但**写什么**有讲究：随机把 87 名刚分手的人分成「正向书写」（这段经历里自己的成长、它说明我在乎什么）、「负向书写」和「中性书写」——只有正向组的即时积极情绪显著提升。跟第 10 条配对使用：降温用负面重评，回血用正向书写，别搞反。\n- 收益：RCT（87 名近期分手者）：正向书写组即时正向情绪提升（负向/中性组无差异）；无长期随访数据。\n- 证据等级：B\n- 来源：Lewandowski GW (2009). Journal of Positive Psychology 4(1). https://doi.org/10.1080/17439760802068480\n- 备注：单次即时效应、样本小，如实按 B。写给有同样经历的读者群甚至有实验显示更高的成长（见第 12 条备注）。\n\n### 12. 分手能长出东西：成长是真的\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：换一个提问。\n- 说人话：心理学里「分手后成长」有实证：92 名刚分手的人在问卷里平均报告 5 类正向改变（更了解自己要什么、关系技能、朋友圈、独立、对未来的清晰），女性多于男性；预测它的是宜人性与「环境归因」（把分手归因于情境而非人格诅咒）。把它当提问用：不是「我失去了什么」，是「这段关系教会我什么」——后者是数据支持的问题。\n- 收益：92 名近期分手本科生：人均报告 5 类正向改变（女>男）；预测=宜人性、环境归因。无百分比发生率（只有均数）。\n- 证据等级：B\n- 来源：Tashiro TY, Frazier P (2003). Personal Relationships 10(1). https://doi.org/10.1111/1475-6811.00039\n- 备注：横断、本科生。写作干预的对照研究显示：写给有共同经历的受众，随访的成长更高（不是闷头写给自己）。\n\n### 13. 分手后别刷前任的动态\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：忍住点开。\n- 说人话：分手后监控前任的社交媒体（俗称视奸）有实测代价：464 名分手者的数据里，控制线下接触和人格后，Facebook 监视与更高的当前痛苦、更多的想念、更低的成长相关。戒断的办法跟戒烟同构：取关/屏蔽（降低触发）、改掉深夜刷的习惯场景（第 5 章）、想看的时候先做点别的（第 10 章第 13 条的分心原理）。\n- 收益：464 名分手者横断：控制线下接触与人格后，Facebook 监视与更高当前痛苦、更多想念/性渴望、更低成长相关。\n- 证据等级：B\n- 来源：Marshall TC (2012). Cyberpsychology, Behavior, and Social Networking 15(10). https://doi.org/10.1089/cyber.2012.0125\n- 备注：相关设计、无频率数据。前任的东西要不要扔——无研究，按自己节奏（这是少数没有标准答案的事）。\n\n### 14. 跟前任做朋友，看动机\n<!-- 成本标签: 难受=中 时间=中 毅力=些 收益=中 口径=心理健康 -->\n- 成本：拿不准就先别。\n- 说人话：跟前任还能不能做朋友，答案取决于「为什么想做」：研究把动机分成四种——因为安全温暖（可以）、实用（共事、共同朋友圈，可以）、礼貌客气（勉强）、**未了的浪漫情感（这一种最伤）**。抱着「做朋友也许还有机会」的，友谊质量更差。判别法很简单：幻想复合吗？幻想，就先不做朋友。\n- 收益：两项问卷研究：因「未了情感」做朋友→更多负面结果；因安全/实用动机→更正面。\n- 证据等级：B\n- 来源：Griffith RL, Gillath O, Zhao X, Martinez A (2017). Personal Relationships 24(3). https://doi.org/10.1111/pere.12197\n- 备注：问卷研究。共同养育孩子的「合作共事」模式另说——那不是友谊，是协作（第 21 条）。\n\n### 15. 分手当面直说，别玩消失\n<!-- 成本标签: 难受=多 时间=少 毅力=否 收益=中 口径=关系质量 -->\n- 成本：一场难受的谈话。\n- 说人话：怎么提分手也有讲究：研究里，安全感强的人更倾向直接、体贴的分手方式；回避、操纵（冷暴力逼人先开口、玩消失）是另一端——被 ghost 一方的睡眠和生活满意度受实打实的影响（第 3 章第 7 条）。分手没法不伤人，但能不羞辱人。\n- 收益：两项研究＋分手策略问卷：安全感与直接、体贴的分手策略相关；回避与操纵策略相关。\n- 证据等级：B\n- 来源：Collins TJ, Gillath O (2012). Journal of Research in Personality 46(2). https://doi.org/10.1016/j.jrp.2012.01.008\n- 备注：被威胁「分手就同归于尽」的，参照第 4 章第 4 条（分手期风险最高）——安全优先于体面。\n\n### 16. 离婚后幸福感会回升，但平均回不到从前\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：校准预期。\n- 说人话：德国 3 万人、18 年的追踪：离婚前满意度一路下滑，离婚后开始回升——但平均回不到婚前的基线。两个修正让数据不吓人：①未来离婚的人婚前就更不快乐（不是离婚把人打垮了一半）；②个体差异极大，多数人适应良好，约 10–15% 长期挣扎。用处：别拿「离婚毁一生」吓自己，也别拿「马上会好」催自己。\n- 收益：SOEP 18 年面板（>30,000 人）：离婚后满意度回升但平均不完全恢复；未来离婚者婚前基线更低（选样+事件双重效应）。荟萃（32 项前瞻研究）：离婚者早亡风险升高（综述表述约 +23%）；多数人适应良好，约 10–15% 长期挣扎。\n- 证据等级：A\n- 来源：Lucas RE (2005). Psychological Science 16(12). https://doi.org/10.1111/j.1467-9280.2005.01642.x ；Sbarra DA, Law RW, Portley RM (2011). Perspectives on Psychological Science 6(5). https://doi.org/10.1177/1745691611414724\n- 备注：非婚分手的大样本恢复时间数据未找到，别引用「平均 X 个月走出失恋」的说法。恢复期的自我照顾见第 5、8 条。\n\n### 17. 高龄离婚翻倍的时代：再婚的离婚风险也高\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=时间精力 -->\n- 成本：知道这两条再决策。\n- 说人话：给「老了将就过」和「老了再找一个就圆满」两边各一条数据：①50 岁以上的离婚率在 1990-2010 间翻倍——「忍到金婚」不再是多数人的路径；②再婚的离婚风险约为初婚的 2.5 倍——第二段婚姻的复杂度（继子女、财务合并、比较历史）真实存在。含义：不将就不是任性；再婚要投入的沟通工程比初婚只多不少。\n- 收益：50+ 人群离婚率 1990-2010 翻倍；再婚离婚风险为初婚约 2.5 倍。美国 35+ 离婚率 1990-2008 翻倍（年轻组持平或降）。\n- 证据等级：B\n- 来源：Brown SL, Lin IF (2012). J Gerontol B 67(6). https://doi.org/10.1093/geronb/gbs089 ；Kennedy S, Ruggles S (2014). Demography 51(2). https://doi.org/10.1007/s13524-013-0270-9\n- 备注：美国数据；中国的高龄离婚趋势数据未核到。继家庭的账见第 18 条。\n\n### 18. 继家庭：继母的位置最难，两边都得知道\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：校准预期、分工讲清。\n- 说人话：荷兰全国样本给继家庭一个反直觉数据：孩子从**继母**处获得的支持少于生母，从**继父**处获得的支持反而多于生父——「继母难当」有结构原因：她进入了别人的母职领地，还被要求「当亲妈」。给重组家庭的实用件：①生父承担管教主力（继母别急着立规矩）；②两边家庭各留专属时间；③钱的规则婚前写清（第 19 条的协议里一并）。\n- 收益：OKiN 全国分层随机样本（25-45 岁，母方 4,351/父方 5,460 份报告）：子女从继母处获得的支持少于生母，从继父处反而多于生父。\n- 证据等级：B\n- 来源：van Houdt K, Kalmijn M, Ivanova K (2019). JMF 82(2). https://doi.org/10.1111/jomf.12599\n- 备注：继家庭无 RCT 级证据。数据来自子女报告。给「找后妈/后爸」的家庭：慢（孩子对新伴侣的接受以年计）比快好。\n\n### 19. 办协议离婚：30 天冷静期＋30 天领证期\n<!-- 成本标签: 难受=少 时间=多 毅力=些 收益=中 口径=人身自由 -->\n- 成本：走流程的 60 天。\n- 说人话：协议离婚现在是「两次到场的 60 天流程」：交申请后 30 天内，任何一方反悔都能撤回；30 天期满后的**再一个 30 天**内，两人要亲自去申领离婚证，不去视为撤回。财产分割、子女抚养、债务写进离婚协议要写细。有家暴、对方不同意的，跳过这个流程直接走诉讼（第 20 条）——冷静期只管协议离婚。打离婚官司前先办第 4 章第 10 条的保护令，人身安全优先于案件胜负。\n- 收益：民法典第 1077 条：款一，自婚姻登记机关收到离婚登记申请之日起三十日内，任何一方不愿意离婚的，可以撤回；款二，前款期间届满后三十日内，双方应当亲自到婚姻登记机关申请发给离婚证；未申请的，视为撤回离婚登记申请。\n- 证据等级：A\n- 来源：《民法典》第 1077 条\n- 备注：诉讼离婚不适用冷静期（体系解释：1076–1078 为登记离婚程序）。财产协议写不清的，花点律师费值——离婚后反悔的成本高得多。\n\n### 20. 有家暴的诉讼离婚：这是法定判离情形\n<!-- 成本标签: 难受=多 时间=多 毅力=是 收益=大 口径=人身安全 -->\n- 成本：一场官司＋证据整理。\n- 说人话：起诉离婚的判离标准是「感情确已破裂」，而**家庭暴力是法律明文列举的情形之一**——不是「家务事」。配套规则：持续性、经常性的家暴按「虐待」论；判不准离婚后又分居满一年、再起诉的，应当准予。\n- 收益：民法典第 1079 条：感情确已破裂调解无效应准予离婚；列举情形第（二）项「实施家庭暴力或者虐待、遗弃家庭成员」；分居满二年、判不准后再分居满一年再诉应准。婚姻家庭编解释（一）第 1 条：持续性、经常性家庭暴力可以认定为「虐待」。\n- 证据等级：A\n- 来源：《民法典》第 1079 条 ；《婚姻家庭编解释（一）》第 1 条 https://www.court.gov.cn/fabu/xiangqing/282071.html\n- 备注：证据同第 4 章第 10 条（出警记录、告诫书、伤情照片、诊疗记录）。诉讼离婚中子女抚养见第 21 条、家务补偿见第 22 条。\n\n### 21. 孩子归谁、抚养费多少、探望怎么办\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=大 口径=金钱 -->\n- 成本：一场谈判或诉讼。\n- 说人话：抚养规则三条硬杠：①不满两周岁，以随母亲直接抚养为原则；②已满八周岁，尊重孩子本人意愿；③中间年龄段，协议优先、协议不成按「最有利于未成年子女」判。抚养费：有固定收入的一般按月总收入的 20–30%（两个以上子女可上浮，一般不超 50%），一般给到 18 岁。探望权受法律保护，对方不能「扣孩子」对抗，抢夺藏匿子女在 2025 年新解释里明确不利于争夺抚养。离婚后的共养质量比离婚本身更影响孩子——干预项目的硬证据见第 15 章第 5 条。\n- 收益：民法典第 1084 条（两周岁/八周岁规则）、第 1085 条（抚养费）、第 1086 条（探望权＋中止与恢复）。婚姻家庭编解释（一）第 49 条（20–30% 比例）、第 53 条（一般至十八周岁）、第 65–68 条（探望不得对子女人身强制执行）；解释（二）第 14 条（家暴方、抢夺藏匿子女等情形优先由另一方抚养）。\n- 证据等级：A\n- 来源：《民法典》第 1084–1086 条 ；《婚姻家庭编解释（一）》第 49、53 条 https://www.court.gov.cn/fabu/xiangqing/282071.html\n- 备注：抚养费可随情况变化请求增加。探望被阻挠的可申请强制执行（对行为，不对孩子）。离婚后孩子的就医、教育节奏见原书第 20、30 节。\n\n### 22. 承担家务多的一方，离婚时可要求补偿\n<!-- 成本标签: 难受=中 时间=中 毅力=些 收益=中 口径=金钱 -->\n- 成本：举证（谁做了什么）。\n- 说人话：全职带娃、照顾老人、牺牲工作的一方，离婚时可以另行要求「家务劳动补偿」——2021 年民法典生效后第一批案例已经判出（如江西湘东区法院判补偿 5 万元），数额按投入的时间精力、对方负担能力、当地收入水平等酌定。留下证据：接送记录、家长群身份、家务支出记录、辞职放弃的履历。别嫌这些琐碎，它们是折成钱的依据。\n- 收益：民法典第 1088 条：一方因抚育子女、照料老年人、协助另一方工作等负担较多义务的，离婚时有权向另一方请求补偿。典型案例：胡某艳诉陈某高离婚纠纷（判补偿 5 万元）。解释（二）第 21 条细化数额考量因素。\n- 证据等级：A\n- 来源：《民法典》第 1088 条 ；最高法新闻局案例 https://www.court.gov.cn/zixun/xiangqing/368621.html\n- 备注：金额通常不高（首批案例万元级），如实预期；它与财产分割、经济帮助是三回事，可并行主张。\n\n### 23. 丧偶之后，钱和手续有清单可查\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=大 口径=金钱 -->\n- 成本：办手续的几天。\n- 说人话：配偶去世后能领回和该办的事：死亡证明与注销户口、火化与殡葬（基础服务有政府定价清单）、社保待遇（丧葬补助金、抚恤金）、公积金余额继承、医保个人账户余额。再婚是自由，继承关系不因再婚自动改变（该有的继承份额还在，该立的遗嘱另立）。这些项目的细则，原书的清单按中国大陆现行规定写全了——照着走一遍，能少跑几趟、少花冤枉钱。\n- 收益：丧葬补助金与抚恤金依《社会保险法》遗属待遇规定（第 17 条，条文原文待人工复核）；公积金余额提取、医保个人账户余额依各自规定；继承顺位依民法典第 1123 条。再婚自由与继承份额见第 7 章第 13 条。\n- 证据等级：C\n- 来源：指路条目——《高性价比人生指南》第 25 节（人走了以后要办什么）：https://github.com/eternity4719/HowToLiveBetter ；《民法典》第 1069、1123 条\n- 备注：指向、不复制。头几个月的身体风险见第 1、2 条——办手续之前，先确认有一个人陪着办。\n","# 12. 性与亲密\n\n性是关系里最容易「说不出口」的部分，也是被传言坑得最狠的部分。本章讲四件事：频率没有标准答案、能开口谈比什么都值钱、出了问题怎么就医、法律红线在哪。口径：关系质量、心理健康、寿命、人身安全。\n\n### 1. 性频率没有「正常值」，每周一次之后收益趋平\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：放下焦虑。\n- 说人话：「多久一次才正常」是个坏问题：全国调查里，过去一个月没有性行为的人接近三成，月频中位数三到四次，也有百分之十几的人每周两次以上——分布从零到很高都正常。真有规律的话只有一条：频率与幸福的关联到每周一次就趋平，更多并不带来更多幸福。比频率值得关心的是：你们各自想要多少、差多少、谈过没有。\n- 收益：3 项研究合计 N=30,645（全国样本＋已婚样本＋夫妻日记）：性频率与幸福感呈曲线关系，超过每周 1 次后不再显著相关，关系满意度为中介。全国概率样本（Natsal 三轮、合计 4.5 万人）：过去一个月无性：女 29.3%、男 29.2%；月中位 3-4 次。GSS（N=26,620，1989-2014）：20 多岁约 80 次/年、60 多岁约 20 次/年，全人群每十年减约 9 次/年。\n- 证据等级：A\n- 来源：Muise A, Schimmack U, Impett EA (2016). Why the Frequency of Sexual Intercourse Predicts Relationship Satisfaction. SPPS 7(4). https://doi.org/10.1177/1948550615616462 ；Wellings K, et al. (2019). Changes in Sexual Attitudes and Lifestyles in Britain. BMJ. https://doi.org/10.1136/bmj.l1525 ；Twenge JM, Sherman RA, Wells BE (2017). Archives of Sexual Behavior 46(8). https://doi.org/10.1007/s10508-017-0953-1\n- 备注：「每周一次之后更多不更幸福」准确说是「不再显著相关（趋平）」，不是变差。频率下降本身不是病，双方都接受就不是问题（见第 6 条）。\n\n### 2. 高潮的差距：谈技巧，先于谈频率\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=关系质量 -->\n- 成本：开口谈这件私事。\n- 说人话：异性恋关系里有一个公开的差距：通常或总能达到高潮的，男性 95%，女性 65%——而女性同性关系里这个数是 86%。差距主要不在身体在流程：女性更需要的铺垫、节奏、直接沟通，恰好都是「说不出口」的重灾区。把「这样行不行、慢一点」说出口，比任何频率管理都值钱。\n- 收益：美国样本 N=52,588：通常/总是达到高潮者——异性恋男 95%、女同 86%、双性恋女 66%、异性恋女 65%。\n- 证据等级：A\n- 来源：Frederick DA, et al. (2018). Differences in Orgasm Frequency Among Gay, Lesbian, Bisexual, and Heterosexual Men and Women. Archives of Sexual Behavior. https://doi.org/10.1007/s10508-017-0939-z\n- 备注：无已知例外。与第 4 条（性沟通的元分析）配套用。\n\n### 3. 女性的性困扰：四成有，一成真痛苦\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=中 口径=心理健康 -->\n- 成本：区分「有问题」与「为此痛苦」。\n- 说人话：美国 3 万多名女性的全国调查：四成多报告至少一种性问题——但其中真正为此痛苦、想改变的只有 12%。「跟别人不一样」不等于需要治；影响心情和关系的才需要。另一半的知识点：女性性功能障碍的药物试验里，疗效的三分之二其实是安慰剂效应——别指望药片，沟通和心理咨询是主力。\n- 收益：PRESIDE 调查 N=31,581 美国女性：任一性问题 43.1%，伴个人痛苦仅 12.0%。药物 RCT 的荟萃再分析（8 项试验）：女性性功能障碍药物疗效的 67.7% 由安慰剂效应解释。\n- 证据等级：A\n- 来源：Shifren JL, et al. (2008). Sexual Problems and Distress in United States Women. Obstetrics & Gynecology. https://doi.org/10.1097/AOG.0b013e3181898cdb ；Weinberger JM, et al. (2018). Obstetrics & Gynecology 132(2). https://pubmed.ncbi.nlm.nih.gov/29995725/\n- 备注：心理干预对性功能障碍的疗效荟萃见第 8 条。\n\n### 4. 性方面能开口谈的伴侣，性和关系都更满意\n<!-- 成本标签: 难受=中 时间=0 毅力=些 收益=大 口径=关系质量 -->\n- 成本：把私密的事说出口的门槛。\n- 说人话：这一条是本章的地基：93 项研究、近 4 万人的荟萃——性沟通越好的伴侣，性满意度（r=.43）和关系满意度（r=.37）都越高；质量比次数重要。不谈的理由都是常见的（难为情、怕伤感情），但不谈的代价是明码标价的。开口的方式照第 3 章的规则来：说具体的事和自己的感受，不评价对方。\n- 收益：meta 93 项研究、N=38,499：性沟通与关系满意 r=.37、性满意 r=.43；质量＞频次；已婚样本 r=.49。另有 meta（48 项研究）：性沟通与总体性功能 r=.35。\n- 证据等级：A\n- 来源：Mallory AB, Sabiston CM (2022). A Meta-Analysis of Sexual Communication. Journal of Family Psychology 36(3). https://doi.org/10.1037/fam0000946\n- 备注：相关设计（也可能是满意的人更敢谈）；干预研究支持改善沟通能改善性满意（Frühauf 荟萃，第 8 条）。无已知例外。\n\n### 5. 拒绝要「安抚式」的，别摔门\n<!-- 成本标签: 难受=少 时间=0 毅力=些 收益=中 口径=关系质量 -->\n- 成本：拒绝时多说半句。\n- 说人话：被伴侣拒绝性邀请的感觉，取决于拒绝的方式而非拒绝本身：安抚式（「今天太累了，周末好好来，先抱会儿」）让被拒方满意度更高；敌意式（「又来？」）让满意度更低——机制是对方感到不被在乎。拒绝不是伤害，轻蔑的拒绝才是。\n- 收益：4 项研究（量表开发＋横断＋日记）：安抚式拒绝→被拒方关系满意度更高，敌意式→更低；伴侣响应性为机制。\n- 证据等级：B\n- 来源：Kim JJ, Muise A, Sakaluk JK, Rosen NO, Impett EA (2020). Are Sexual Construals and Rejection Sensitivity Linked to Sexual and Relational Well-Being? PSPB 46(10). https://doi.org/10.1177/0146167220907469\n- 备注：与第 3 章「拒绝的模板」同一原理。低自尊方对性拒绝更敏感（拒绝敏感见第 18 章第 3 条）。\n\n### 6. 欲望有差距是常态，别急着判「谁坏了」\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=关系质量 -->\n- 成本：接受差距、谈出中间值。\n- 说人话：一对伴侣想要的不一样，是规律不是事故：长期关系里双方性活动双双下降，而**性欲**的下降女性更明显——这来自德国样本，有争议但方向被反复看到。研究同时确认：期望与实际的差距越大，关系满意度和稳定性越低。解法不是拉齐数字，是把它当「可谈的账」：固定频率的折中、轮流主动、把亲密和性交解绑（拥抱按摩也算亲密）。\n- 收益：已婚 1,054 对：个人性欲差距越大→关系满意度、稳定性越低，冲突越多。德国 19-32 岁样本 N=1,865：性活动与满意度两性均随关系时长下降；性欲仅女性下降（横断面、学生样本，进化论解读有争议）。\n- 证据等级：B\n- 来源：Willoughby BJ, Farero A, Busby DM (2014). Exploring the Range of Frequency of Dyadic Sexual Desire. Archives of Sexual Behavior. https://doi.org/10.1007/s10508-013-0181-2 ；Klusmann U (2002). Sexual Motivation and the Duration of Partnership. Archives of Sexual Behavior 31(3). https://doi.org/10.1023/a:1015205020769\n- 备注：「约三分之一伴侣有显著欲望差距」的流行数字未核到原始出处，不引。差距持续且痛苦的，性治疗（第 8 条）是正路。\n\n### 7. 产后的性问题：普遍、可恢复、要去问\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：产后复查时开口问一句。\n- 说人话：初产妇的头半年：九成会恢复性生活，但性问题非常普遍——产后 3 个月八成有、6 个月降到六成多（孕前是四成不到）；3 个月时的性交痛接近六成。这些数字的意思是「你不是一个人」＋「多数会好转」＋「只有 15% 的人会去问医务人员——去做那 15%」。产后 42 天复查就是开口的场合。\n- 收益：初产妇 796 人、6 个月随访 484：6 个月内恢复性活动 89%；性问题 3 月 83%、6 月 64%（孕前 38%）；仅 15% 向医务人员求助；3 月性交痛 58%。「42 天复查」为临床惯例。\n- 证据等级：A\n- 来源：Barrett G, et al. (2000). Women's Sexual Health After Childbirth. BJOG 107(2). https://doi.org/10.1111/j.1471-0528.2000.tb11689.x\n- 备注：疼痛持续、哺乳相关的干涩，都能处理（润滑、局部雌激素评估）——挂妇科。产后抑郁的信号与照护见原书第 27 节。\n\n### 8. 性功能障碍：心理治疗真有效，先于（或伴随）药物\n<!-- 成本标签: 难受=中 时间=多 毅力=是 收益=大 口径=心理健康 -->\n- 成本：挂号与疗程。\n- 说人话：性治疗不是「聊聊天」：20 个随机试验的荟萃——心理干预（认知行为、性治疗）把症状严重度降了约 0.6 个标准差、性满意度提升 0.47；女性性欲低下和高潮障碍的证据最强。男性的勃起问题先去泌尿外科/男科查血管（见第 9 条），但心理成分同样常见（表现焦虑）。\n- 收益：20 个 RCT 的荟萃：心理干预 vs 等待对照：症状严重度 d=0.58（0.40-0.77）、性满意度 d=0.47（0.27-0.70）。\n- 证据等级：A\n- 来源：Frühauf S, et al. (2013). The Efficacy of Psychological Interventions for Sexual Dysfunction. Archives of Sexual Behavior 42(6). https://pubmed.ncbi.nlm.nih.gov/23559141/\n- 备注：挂号路径与少花冤枉钱见原书第 24 节。夫妻一起去的性治疗对欲望差距尤其合适。\n\n### 9. 勃起出问题，先查心血管\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=大 口径=寿命 -->\n- 成本：挂一次泌尿外科/男科。\n- 说人话：勃起功能障碍（ED）常是心血管系统的前哨：14 个队列、9 万多人的荟萃——ED 的人总心血管事件风险高 44%、心梗高 62%、全因死亡高 25%；越年轻相对风险越高。血管是一条管道，阴茎的血管先细先堵。所以 ED 别只当「男科面子问题」，它可能是十年内心脏的提醒。就诊科室：泌尿外科或男科。\n- 收益：14 个队列、92,757 人：ED 者总心血管事件 RR 1.44（1.27-1.63）、心梗 1.62（1.34-1.96）、脑血管事件 1.39、全因死亡 1.25；年龄越轻 RR 越高。\n- 证据等级：A\n- 来源：Vlachopoulos CV, et al. (2013). The Role of Erectile Dysfunction as a Predictor of Cardiovascular Events. Circ Cardiovasc Qual Outcomes 6(1). https://pubmed.ncbi.nlm.nih.gov/23300267/\n- 备注：⚠「ED 早于心梗 2-5 年」是综述演绎的说法，不作为该文数字引用。治疗 ED 的常用药（PDE5 抑制剂）本身与更好的心血管结局相关（见第 10 条）。\n\n### 10. 用「伟哥」类药物的两条纪律\n<!-- 成本标签: 难受=0 时间=少 毅力=否 收益=大 口径=寿命 -->\n- 成本：记住两条规则。\n- 说人话：PDE5 抑制剂（西地那非等）总体安全，长期用甚至与更低的心血管事件和死亡风险相关。只有一条绝对禁忌：**正在用任何剂型的硝酸酯类药物（硝酸甘油等）的人不能用**——两药相遇血压能崩。第二条：别网购「壮阳药」：渠道、剂量、掺假都不可控，正规处方一条龙解决。\n- 收益：国际泌尿外科指南（EAU 2021、AUA 2018）：正使用任何剂型硝酸酯类药物者禁用 PDE5i。长期用药荟萃（16 项研究、125.8 万人）：PDE5i 使用者 MACE RR 0.78、全因死亡 RR 0.70。\n- 证据等级：A\n- 来源：EAU Guidelines on Sexual and Reproductive Health (2021). Eur Urol 80(3). https://pubmed.ncbi.nlm.nih.gov/34183196/ ；Soulaidopoulos S, et al. (2024). https://pubmed.ncbi.nlm.nih.gov/38777751/\n- 备注：网购假药见原书第 6 节（反面清单）。用药前把心脏情况交给医生评估（见第 9 条）。\n\n### 11. 老了还想有性生活，是常态不是新闻\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=寿命 -->\n- 成本：改一个观念。\n- 说人话：55 岁时的预期「性活跃年数」：男性约 15 年、女性约 11 年；75-85 岁仍性活跃的，男 39%、女 17%；健康自评极好的人这段更长。数据不是动员令，是祛魅：老年性需求是常规存在，不是羞耻的事。相应地，老年性健康（干涩、药物相互作用、慢性病姿势）值得跟医生正经谈。\n- 收益：美国代表性样本（N=3,032＋3,005）：55 岁性活跃预期寿命男 14.9-15.3 年、女 10.6 年；75-85 岁性活跃男 38.9%、女 16.8%。\n- 证据等级：A\n- 来源：Lindau ST, Gavrilova N (2010). Sex, Health, and Years of Sexually Active Life. BMJ. https://doi.org/10.1136/bmj.c810\n- 备注：丧偶后重新开始亲密生活（含新的性伴侣）的，安全与健康注意点同年轻人：见第 12 条。\n\n### 12. 换了伴侣，检测要跟着换\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=大 口径=人身安全 -->\n- 成本：一次检测＋一次谈话。\n- 说人话：新的性关系开始前，两个人一起做一次检测，是性价比最高的安全动作。感染者有告知义务：艾滋病防治条例规定感染者应将感染事实及时告知性伴、采取防护措施，故意传播要承担赔偿乃至刑事责任；婚前重大疾病隐瞒可以诉请撤销婚姻（民法典第 1053 条）。发生高危行为（对方检测阳性、无保护）后的 72 小时是暴露后预防（PEP）的窗口——最好 2 小时内、不超过 72 小时，连服 28 天，各地疾控和定点医院有。\n- 收益：《艾滋病防治条例》第 23 条（自愿咨询检测、免费）、第 38 条（告知义务）、第 39 条（隐私保护）、第 62 条（故意传播担责）。WHO 系统综述（含 3 个 RCT）：协助伴侣告知使伴侣检测率 RR 1.46、阳性检出 RR 1.47，伤害事件极少。PEP：尽可能 2 小时内、最好 24 小时内、不超过 72 小时、连服 28 天。\n- 证据等级：A\n- 来源：《艾滋病防治条例》（2006 公布，2019 修订） https://www.gov.cn/gongbao/content/2019/content_5468885.htm ；Dalal S, et al. (2017). AIDS 31(13). https://pubmed.ncbi.nlm.nih.gov/28590326/ ；中国疾控中心《艾滋病病毒暴露后预防技术指南（试行）》\n- 备注：检测自愿、结果保密（条例第 39 条）。PEP 指南为「试行」版本，会迭代。安全性行为的具体器具不做推荐，按疾控指引。\n\n### 13. 被胁迫做不愿意的性行为：这是暴力，不是关系\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=大 口径=人身安全 -->\n- 成本：认清这件事的性质。\n- 说人话：婚内、恋爱内都不是性要求的通行证：违背意愿的性行为按法律处理（现行依据是刑法第 236 条的「其他手段」与个案认定；1984 年的那套旧解答已废止，别再引）。亲密关系里「不」的有效性，与第 4 章的红线同构：被胁迫、被以暴力威胁、或被灌醉到无力反抗的，是刑事问题——留证据（聊天记录、伤情、就医记录）、报警、申请人身安全保护令（第 4 章第 10 条）。\n- 收益：刑法第 236 条（强奸罪，含以「其他手段」）；现行司法解释无「醉酒与同意」专门条文（1984 两高一部解答已废止，法释〔2013〕1 号），依个案认定。\n- 证据等级：A\n- 来源：《刑法》第 236 条 ；法释〔2013〕1 号 https://www.court.gov.cn/fabu/xiangqing/5029.html\n- 备注：本条为性质界定与指路，实操流程同第 4 章（报警、保护令、证据）。未成年人相关的专门规定（含照护职责人员性侵罪、隔空猥亵）见第 16 章第 10 条。\n","# 13. 姻亲与大家庭\n\n婆媳、过年、亲戚——中国式关系难题的主战场。本章讲三件事：姻亲怎么伤婚姻、夫妻怎么站队、过年和钱怎么谈。口径：关系质量、心理健康、金钱、时间精力。\n\n### 1. 婆媳关系差，是产后抑郁的强预测因子\n<!-- 成本标签: 难受=少 时间=中 毅力=是 收益=大 口径=心理健康 -->\n- 成本：把关系当健康变量来经营。\n- 说人话：坐月子不是养生问题，是关系问题：51 项中国研究的荟萃里，婆媳关系差的女性产后抑郁的几率接近三倍（OR 2.89）；香港 959 名孕妇的前瞻追踪里，婆媳冲突独立预测产后抑郁。反过来，「婆婆来照顾」本身不是问题——深圳样本里照顾者是谁（婆婆还是亲妈）调整后与抑郁无关联。伤人的是关系质量，不是哪位长辈的身份。\n- 收益：51 项中国研究的荟萃：婆媳关系差 OR 2.89（95%CI 2.12-3.95）；婆婆为主要照顾者 OR 1.95；孕期抑郁 OR 7.70。前瞻队列（N=959）：婆媳冲突独立预测产后抑郁。反向证据（N=1,325）：多变量调整后主照顾者身份与 PPD 无关联。\n- 证据等级：A\n- 来源：Qi W, et al. (2021). A Meta-Analysis of the Relationship Between Maternal Role and Postpartum Depression. BMC Pregnancy & Childbirth. https://doi.org/10.1186/s12884-021-03657-0 ；Lee DTS, et al. (2004). Br J Psychiatry 184:34-40. https://doi.org/10.1192/bjp.184.1.34\n- 备注：给伴侣看的一条：产后的婆媳安排里，丈夫的角色见第 5 条。产后抑郁的就医信号见原书第 27 节。\n\n### 2. 姻亲不睦是慢性毒药，多年后才显形\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=关系质量 -->\n- 成本：早投入维护。\n- 说人话：跟对方父母的关系，别只看当下吵不吵：美国前瞻追踪（婚龄平均近 20 年）发现，**婚前**与姻亲的不睦预测**多年后**婚姻的满意度、稳定性、承诺全面下降——姻亲冲突是慢性的，领证时不显形，十几年后算总账。刚结婚那两年的「客气」，值得多花一倍力气维持。\n- 收益：前瞻纵向（婚龄平均近 20 年）：姻亲不睦预测后续婚姻成功度（稳定性、满意度、承诺）下降。中年夫妻样本（n=164）：夫妻支持姻亲的不平衡→婚姻满意度更低。\n- 证据等级：B\n- 来源：Bryant CM, Conger RD, Meehan PA (2001). The Influence of In-Laws on Change in Marital Success. Journal of Marriage and Family 63(3). https://doi.org/10.1111/j.1741-3737.2001.00614.x ；Lee H, Kim J, Cichy KE, Fingerman KL (2020). The Gerontologist 66(4). https://doi.org/10.1159/000505589\n- 备注：观察性研究。这条与第 1 条合看：姻亲影响婚姻是长程账。\n\n### 3. 和婆婆的冲突，两边都在报\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：别只怪自己。\n- 说人话：婆媳难处不是你一个人的错，也不是某一代人的错：美国调查里，**儿子和女儿女婿两边**，报告与婆婆的冲突都多于与自己亲妈；而母亲们报告与儿媳的冲突也多于与亲生女儿。这是结构的常态（两个女人共享对一个男人的期待），不是谁「天生难搞」。结构的问题用结构解：边界（第 4 条）＋中间人（第 5 条）。\n- 收益：美国问卷研究：男女双方报告与婆婆的冲突均多于与自己母亲；母亲报告与儿媳的冲突多于与亲生女儿。\n- 证据等级：B\n- 来源：Ayers JD, Krems JA, Hess NC, Aktipis A (2022). Intergenerational Conflict from the Perspective of Mothers and Their Offspring. Evolutionary Psychological Science 8(1). https://doi.org/10.1007/s40806-021-00312-x\n- 备注：小样本、无中国数据（但中国婆媳研究见第 1 条）。别把这条当「谁都有错和稀泥」——升级到控制与贬低的，按第 4 章处理。\n\n### 4. 夫妻站同一边，亲戚的事你们俩说了算\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=大 口径=关系质量 -->\n- 成本：在自己父母面前跟伴侣站队的勇气。\n- 说人话：家庭治疗的老话「夫妻联盟优先」有定量支持：新婚三口组（夫妻＋一位姻亲）的社会关系测量里，**婚姻二元对满意度的解释力大于姻亲二元**。实操就一句话：各家父母的事，各自去应付；伴侣的立场你当众维护，分歧关起门谈。当着婆婆的面让伴侣下不来台，输掉的不是那一局。\n- 收益：社会关系模型（98 个新婚夫妻＋一位姻亲三人组）：婚姻二元对满意度的解释力大于姻亲二元；婚姻内互惠更强。\n- 证据等级：B\n- 来源：Morr Serewicz JL (2008). The Family Triad. Journal of Family Communication 8(4). https://doi.org/10.1080/15267430802397161\n- 备注：小样本。「各自应付自家人」同时降低了第 5 条的调停压力。\n\n### 5. 婆媳之间的男人：当「翻译」别当「传声筒」\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=时间精力 -->\n- 成本：学一门新活。\n- 说人话：婆媳之间的丈夫/儿子，最差的角色是传声筒（「我妈说……」「她说你……」——逐字转播，火药加倍）；合适的角色是翻译＋缓冲：把妈的意思消化后说立场（「我们俩商量了，这事我们这样安排」），把伴侣的难处翻译成老人听得进的话。研究也提示被夹在中间的男方怎么归因，影响他的调停效果。\n- 收益：归因研究：处于调停位置的丈夫对婆媳冲突的归因方式与其沟通行为相关。夫妻联盟的定量证据见第 4 条。\n- 证据等级：B\n- 来源：Rittenour CE, Koenig Kellas J (2015). Managing Third-Party Conflict Communication. Communication Quarterly 63(1). https://doi.org/10.1080/01463373.2014.965837\n- 备注：传声筒式转播的恶果，跟第 15 章第 7 条（别把孩子当传话筒）同一原理。节日集中见面的场合，提前跟伴侣对好「今天的分工」。\n\n### 6. 过年回谁家：没有研究，但有谈判法\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=时间精力 -->\n- 成本：每年一次的谈判。\n- 说人话：「轮流还是各回各的」这个问题，学术研究没有（如实说明）；民族志倒是记录了新婚夫妻的春节归属谈判是普遍的家庭政治。谈判框架照第 3 章的规则：提前谈（别腊月二十八开战）、按年轮换或各回各的都写进惯例、两地都留部分假期。谁的地盘谁应酬，伴侣不当工具人。\n- 收益：无同行评审研究。民族志（阎云翔《中国社会的个体化》）记录春节归属的代际博弈。\n- 证据等级：C\n- 来源：经验做法；田野观察见阎云翔 (2009).《中国社会的个体化》.\n- 备注：C 级如实标注。这条的价值在「把每年一次的火并变成既定惯例」——惯例一旦形成，谈判成本归零。\n\n### 7. 父母的钱不是白拿的：资助与干涉常成对出现\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=金钱 -->\n- 成本：接受资助前想清楚。\n- 说人话：买房带娃的钱跟干涉常常打包出现：安徽 2,460 对夫妻的数据里，婆媳关系对婚姻苦恼的直接效应高达 β=0.69。钱要不要？该要（见第 7 章第 5 条的代际互惠账），但要得明白：拿了钱就提前谈好边界（怎么养孩子谁说了算、房子登记谁名下）、把「拿钱」和「交权」解绑。法律侧：父母出资购房的性质认定（赠与个人还是夫妻共同），按婚姻家庭编司法解释走，原书第 10 节有细则。\n- 收益：安徽 2,460 对夫妻：婆媳关系对婚姻苦恼的直接效应 β=0.69（p<0.001）。父母出资购房的性质认定（赠与个人还是夫妻共同）按现行婚姻家庭编司法解释处理，细则见原书第 10 节。\n- 证据等级：B\n- 来源：Tang C, et al. (2025). J Affect Disord 389:119702. ；《高性价比人生指南》第 10 节 https://github.com/eternity4719/HowToLiveBetter\n- 备注：β 是未标准化的关联强度，别翻译成「七成离婚因为婆媳」。出资的具体条文号以原书第 10 节和现行解释为准（本轮未逐条核对，引用前自查）。\n\n### 8. 亲戚借钱：感情归感情，手续归手续\n<!-- 成本标签: 难受=多 时间=少 毅力=否 收益=大 口径=金钱 -->\n- 成本：开口要手续的尴尬。\n- 说人话：亲戚借钱的坏账率没有研究统计（如实说明），但第 3 章第 9 条的规则在亲戚这里加倍成立：金额大的，借条照写、转账备注用途；「都是一家人」恰恰是不写借条的最常见原因，也是最常见的事后翻脸原因。抵押和担保在亲属间格外危险（第 4 章的反面教材在原书第 8 节）。\n- 收益：无直接研究（如实标注）。法律要件见《高性价比人生指南》第 8 节（借条、担保的写法与后果）。\n- 证据等级：C\n- 来源：经验做法；《高性价比人生指南》第 8 节 https://github.com/eternity4719/HowToLiveBetter\n- 备注：C 级。额度原则沿用第 3 章第 9 条：要不回也认的上限内借。\n\n### 9. 家族群：减少成本，别退群\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=小 口径=时间精力 -->\n- 成本：设置消息免打扰。\n- 说人话：家族群的红线是「别在里面办正事」（借钱、说教、评头论足一发不可收拾），长处是低成本维系「脸熟」（第 5 章第 6 条的固定见面逻辑在群里的版本）。免打扰＋节日冒泡＋长辈的养生谣言私聊提醒（对照原书第 6 节反面清单），是性价比组合。\n- 收益：无直接研究（微信群行为无学术研究）。家庭仪式与关系功能的综述见第 10 条。\n- 证据等级：C\n- 来源：经验做法。\n- 备注：C 级。长辈被骗（保健品、养老骗局）的识别与应对见原书第 17 节。\n\n### 10. 大家庭聚会：要的不是热闹，是惯例\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=中 口径=关系质量 -->\n- 成本：每年固定的几次聚餐组织。\n- 说人话：50 年研究的综述结论：家庭仪式（固定节庆、生日惯例）与家庭关系功能稳定正相关——注意起作用的是**惯例性**（「我们家每年都……」），不是排场。轮流坐庄、固定日子、没人改期的群名，比一年一次的高档酒店有效。老人见面频率的健康账见第 7 章第 1 条。\n- 收益：50 年 32 篇文献综述：家庭常规与仪式与婚姻满意度相关（方法偏弱）；120 对夫妻的研究：节日仪式独立于总体宗教性与婚姻满意度相关。\n- 证据等级：B\n- 来源：Fiese BH, et al. (2002). A Review of 50 Years of Research on Naturally Occurring Family Routines and Rituals. J Fam Psychol 16(4). https://doi.org/10.1037//0893-3200.16.4.381 ；Fiese BH, Tomcho TJ (2001). J Fam Psychol 15(4). https://doi.org/10.1037/0893-3200.15.4.597\n- 备注：相关设计、方便样本。惯例一旦中断（变故那年），重启比维持贵——委托一位「惯例守护人」。\n","# 14. 人情往来的账\n\n随礼、请客、求人办事、还人情——「人情」是中国关系里的隐形货币，有汇率、有账本、有违约。本章讲怎么记账不吃亏、怎么送礼送到点上。这章的学术证据天然偏弱（社会学家多为田野调查），C 级条目比别的章多，如实标注。口径：金钱、心理健康、时间精力。\n\n### 1. 随礼按账本定，别按面子定\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=金钱 -->\n- 成本：建一个随礼账本。\n- 说人话：礼金的民间汇率有结构：村庄研究用多年礼账（礼簿）做的分析显示，礼金网络是「非正式保险」——你随出去的，是在给自家红白事攒赔付。实操三条：①按对方当年给的回（账本比记性可靠）；②跟共同熟人对齐价位（单独高出头=给所有人为难）；③关系明显冷却的就按惯例收尾，别用大额硬撑。份子钱通胀别去硬扛——结构研究显示它是群体军备竞赛，个人的「懂事」改变不了水位。\n- 收益：村庄多轮普查＋长期礼账记录：送礼网络中心性与非正式保险正相关；礼金升级的结构主因为不平等与婚姻竞争。\n- 证据等级：B\n- 来源：Chen X (2014). Social Networks and Social Support in Rural China. PLoS ONE 9(8). https://doi.org/10.1371/journal.pone.0102104\n- 备注：礼账数据是真实行为记录（非自报），但属单村数据。大额超出承受的：预算法（每月人情预算封顶）比面子法活得久。\n\n### 2. 送礼送「他点名要的」，别送「你觉得有意义的」\n<!-- 成本标签: 难受=0 时间=少 毅力=否 收益=中 口径=金钱 -->\n- 成本：问一句。\n- 说人话：实验结论干脆：送对方明确想要的东西（照清单、照意愿），比送惊喜、送「有寓意有故事」的礼物更受欢迎——送礼的人高估了「用心感」，低估了「对方用得上」。经济学的佐证：礼物估值平均低于花费的 10-33%（「圣诞节的死重损耗」）。所以别怕要清单、别怕送红包：收礼的人不在意你的惊喜成本。\n- 收益：实验：清单式礼物比惊喜式、自认有意义的礼物更受欢迎。礼物估值低于成本的 10-33%（⚠ 10-33% 为学界通行转述数字，原文未逐字核）。\n- 证据等级：B\n- 来源：Gino F, Flynn FJ (2011). Give Them What They Want. JESP 47(5). https://doi.org/10.1016/j.jesp.2011.03.015 ；Waldfogel J (1993). The Deadweight Loss of Christmas. AER 83(5). https://doi.org/10.2307/2118333\n- 备注：给多人送礼时别追求每份「独特」——实验显示送者偏爱错开品类，受者反而觉得不受欢迎（Steffel & Le Boeuf 2014, JCR 40(6)）。红率和红包的关系见第 8 条。\n\n### 3. 先给点小的好处，确实管用——但有代价\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=金钱 -->\n- 成本：无（但看备注）。\n- 说人话：互惠是人性里最硬的螺丝之一：受过小好处的人，在公开场合答应对方请求的比例显著更高（私下差异小——互惠一半是给围观者看的）。用它两头都能用：求人办事前先真诚帮个真小忙，成功率上升；反过来，收了「免费的小礼物」再被推销时，提醒自己正在互惠旋涡里。\n- 收益：实验：受小恩者在公开条件下顺从捐款请求显著更高、私下差异小（互惠未完全内化）。\n- 证据等级：B\n- 来源：Whatley MA, Webster JM, Smith RH, Rhodes A (1999). The Effect of a Favor on Public and Private Compliance. Basic and Applied Social Psychology 21(3). https://doi.org/10.1207/S15324834basp2103_8\n- 备注：代价在受方：接受帮助会带来「亏欠感」与自尊威胁（自助者的账：能自己办的别欠人情，见第 6 条）。\n\n### 4. 「先大后小」的留面子，谈判时用得上\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=金钱 -->\n- 成本：被拒一次大请求的尴尬。\n- 说人话：求人时先提一个明知会被拒的大请求，再提真正的小请求，成功率翻几倍——经典实验里从约 17% 升到约 50%（被拒的大请求制造了让步的台阶，对方「还」你一个同意）。用在正当谈判（加薪、调岗、砍价）有效；识别它被用在你身上（「先推荐贵套餐再退到中套餐」）同样有效。\n- 收益：经典实验：陪少年逛动物园的大请求对照组约 17% 同意，「留面子」组约 50%（⚠ 数字为学界通行转述，原文 PDF 未核）。\n- 证据等级：B\n- 来源：Cialdini RB, et al. (1975). Reciprocal Concessions Procedure for Inducing Compliance. JPSP 31(2):206-215. https://doi.org/10.1037/h0076284\n- 备注：互惠让步的原理与第 3 条同源。销售培训天天在教这个——学它是为了防守。\n\n### 5. 还人情的节奏：别抢着「结清」\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=小 口径=心理健康 -->\n- 成本：忍住立刻回请的冲动。\n- 说人话：人情账的民间算法是「不结清」：纵向研究显示，关系里觉得**公平**的人满意度最高，受惠不足最惨；但受惠过度（一直占便宜）也低于公平组。而心理学给了个反直觉补丁：被帮助这件事本身有压力——受惠过多的人会不适、亏欠、甚至躲着恩人。所以还人情别当日结清（像还债=宣布关系是交易），也别拖成坏账；找自然的机会「还」到接近平衡，让账面永远留着下次往来的理由。\n- 收益：纵向研究：公平者满意度最高、受益不足最差、受益过度亦低于公平组。受助的 self-esteem 威胁模型：受惠可引发不适与亏欠感。\n- 证据等级：B\n- 来源：Van Yperen NW, Buunk BP (1990). Equity Theory and the Frequency of Exchange. EJSP 20(4). https://doi.org/10.1002/ejsp.2420200403 ；Fisher JD, Nadler A, Whitcher-Alagna S (1982). Psychological Bulletin 91(1). https://doi.org/10.1037/0033-2909.91.1.27\n- 备注：亲密关系里「看不见的支持」比显性支持更减压（对方没意识到的搭把手，见第 3 章第 10 条旁证）——最贵的人情是让对方没负担的那种。\n\n### 6. 求人办事的「利他包装」要克制\n<!-- 成本标签: 难受=少 时间=少 毅力=否 收益=中 口径=时间精力 -->\n- 成本：直说请求。\n- 说人话：「我是为你好才拉你入伙」的人情话术，收效适得其反：受托方如果感到被架（不办=不给你面子/不懂回报），适度的亏欠感会翻成怨气。直接说事＋给退路（「不方便没关系」）反而体面。真正的关系维护在请求之外：平时的往还（第 1、5 条）才是能取的余额。\n- 收益：受惠的代价机制见第 3、5 条。「利他包装 vs 直陈请求」的直接对照实验未找到（如实标注）。\n- 证据等级：C\n- 来源：经验做法；机制旁证见 Whatley 1999、Fisher 1982（第 3、5 条）。\n- 备注：C 级。求帮忙本体的「低估被答应」见第 3 章第 1 条——开口比想象中容易。\n\n### 7. 请客与 AA：规则先说清\n<!-- 成本标签: 难受=中 时间=0 毅力=否 收益=小 口径=金钱 -->\n- 成本：开口定规则的尴尬。\n- 说人话：谁买单的规则越模糊，饭越难吃。人情-面子理论把请客视为关系投资（我出钱、你欠情），AA 视为平账——两种都成立，混着来才出事。实操：发起人先声明（「这顿我做东」或「AA 算」）；轮流坐庄比当场抢单体面（抢单是表演，轮庄是制度）。中式的「抢着买单」按社会学家的写法是面子竞赛——参与可以，当真不必。\n- 收益：理论：人情与面子的经典模型（含请客与报答规则）；无对照实验（如实标注）。\n- 证据等级：C\n- 来源：Hwang KK (1987). Face and Favor: The Chinese Power Game. AJS 92(4). https://doi.org/10.1086/228588\n- 备注：C 级（理论经典）。制度化的轮庄能把饭局成本变成可预算项。\n\n### 8. 微信红包：小额、高频、别当礼\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=金钱 -->\n- 成本：无。\n- 说人话：红包是数字时代的人情零钱：好的用法是小额高频（节日、谢意、群活跃），坏用法是拿它办大事（大额转账当随礼——没账本、没仪式、没收据）。研究把微信红包/转账描述为「货币化的社交」——钱和关系的边界在指尖变模糊。替代现金往来时问一句：这笔钱走「人情账」还是「法律账」？后者走转账备注（第 3 章第 9 条）。\n- 收益：质性研究：红包/转账构成货币化社交（转账行为重塑关系义务）。无定量效应（如实标注）。\n- 证据等级：C\n- 来源：Li J-X (2025). Journal of Cultural Economy 18(2). https://doi.org/10.1080/17530350.2025.2455464\n- 备注：C 级。收红包别回抢「最小金额红包」大战——互惠的表演成本（第 5 条）。\n\n### 9. 拒绝请托：三段式照旧好用\n<!-- 成本标签: 难受=多 时间=0 毅力=否 收益=中 口径=时间精力 -->\n- 成本：说「不」的难受。\n- 说人话：人情社会里最贵的字是「不」。没有专门实验研究「怎么拒请托」（如实标注），但第 3 章第 7 条的模板平移过来就是：明确（「这次帮不了」）＋短理由（「最近腾不出手」）＋（可选）替代方案（「帮你问问谁熟」）。人情场合加一条：给台阶（「等我缓过这阵请你喝酒」）。别用「再说吧」拖——那等于把违约利息开着滚。\n- 收益：无直接研究。拒邀被高估的实验证据（第 3 章第 8 条）表明：请求方对被拒的负面反应被系统性高估。\n- 证据等级：C\n- 来源：经验做法；配套证据见第 3 章第 6、8 条。\n- 备注：C 级。涉及借钱、担保的拒绝，直接走第 13 章第 8 条（亲戚借钱）与原书第 8 节。\n\n### 10. 农村送礼的真实收益：低收入家庭的幸福感\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：无。\n- 说人话：替随礼辩护一条：CFPS 面板数据显示，农村家庭的送礼消费与主观幸福感正相关——对低收入家庭显著，高收入家庭不显著。礼金网络对资源少的家庭是真实的安全网（借车、搭手、急难时的众筹）。这条不是让你多随，是说明：人情支出对拮据家庭不是纯浪费，砍它之前想清楚砍掉的是什么。\n- 收益：CFPS 面板：农村送礼消费显著提升主观幸福感（低收入组显著、高收入组不显著）。\n- 证据等级：B\n- 来源：Chiu Y, Wang X, Ye R (2022). Gift Expenditure and Subjective Well-Being. Review of Economics of the Household 21(4). https://doi.org/10.1007/s11150-022-09631-9\n- 备注：面板观察、非实验。理论与民族志背景：Kipnis《Producing Guanxi》、阎云翔《礼物的流动》。\n","# 15. 育儿中的关系\n\n打骂、表扬、隐私、离婚怎么跟孩子说——亲子关系的证据比想象中硬。本章讲三件事：日常怎么处（打骂与表扬）、结构性的大事怎么处理（离婚与共养）、兄弟姐妹与同龄人。口径：心理健康、关系质量。\n\n### 1. 别打：13 项指标里 12 项是坏的\n<!-- 成本标签: 难受=中 时间=0 毅力=是 收益=大 口径=心理健康 -->\n- 成本：改掉「上头就动手」的反射。\n- 说人话：16 万名儿童、111 个效应量的荟萃：打骂（含「打屁股」这种轻度体罚）与攻击、道德内化、亲子关系等 13 项结局指标里，12 项显著且全部指向坏处；打屁股与身体虐待的效应量没有实质差异。唯一的「好处」是即时服从——五分钟的效果，换长期的账。管教要的是有效：规矩＋一致性＋理由（第 7 章第 7 条的自主支持框架）。\n- 收益：111 个效应量、160,927 名儿童的荟萃：17 项平均效应量中 13 项显著且全部指向有害；打屁股与身体虐待效应量无实质差异。88 项研究的更早荟萃：11 类结局中仅「即时服从」为正。\n- 证据等级：A\n- 来源：Gershoff ET, Grogan-Kaylor A (2016). Spanking and Child Outcomes: Old Controversies and New Meta-Analyses. J Fam Psychol 30(4). https://pubmed.ncbi.nlm.nih.gov/27055181/ ；Gershoff ET (2002). Psychological Bulletin 128(4). https://doi.org/10.1037/0033-2909.128.4.539\n- 备注：相关证据（因果需谨慎），但剂量与结局的一致性极强。管孩子不打不吼骂的实操见原书第 30 节；替代工具是第 7 章第 10 条的自主支持框架。\n\n### 2. 表扬：夸努力，别夸聪明\n<!-- 成本标签: 难受=0 时间=0 毅力=些 收益=中 口径=心理健康 -->\n- 成本：改一句口头禅。\n- 说人话：「你真聪明」听着是好话，实验里的后患明确：被夸聪明的孩子失败后成绩下滑、回避挑战（聪明是不许输的身份）；夸努力和过程（「这个解法是你自己试出来的」）的孩子迎难而上。对低自尊的孩子还有个坑：大人爱给这类孩子夸张表扬（「太惊人了！」）——实验显示夸张表扬反而降低他们的挑战意愿。朴素、具体、针对过程。\n- 收益：经典实验：夸聪明→失败后成绩下滑、回避挑战；夸努力相反。实验+自然观察：成人确实更常给低自尊儿童夸张表扬；夸张表扬降低低自尊儿童的挑战寻求、对高自尊相反。\n- 证据等级：A\n- 来源：Mueller CM, Dweck CS (1998). Praise for Intelligence Can Undermine Children's Motivation and Performance. JPSP 75(1). https://doi.org/10.1037/0022-3514.75.1.33 ；Brummelman E, et al. (2014). \"That's Not Just Beautiful—That's Incredibly Beautiful!\" Psychol Sci 25(4). https://doi.org/10.1177/0956797613514251\n- 备注：机制是「固定型 vs 成长型」的自我理论。夸人（成人版）见第 1 章第 6 条——对方比你以为的更受用。\n\n### 3. 敏感回应可以学：依恋安全是能教的\n<!-- 成本标签: 难受=少 时间=中 毅力=是 收益=大 口径=关系质量 -->\n- 成本：学「看懂婴儿信号」的训练。\n- 说人话：「孩子跟谁亲是天生的」是错的：70 项研究的荟萃里，教父母「敏感照护」（准确识别孩子信号、及时一致地回应）的干预，把孩子建立安全型依恋的比例提高了约 0.2 个标准差——效应不大但稳定，且中短程、聚焦行为的课程最有效。安全依恋的意义在第 5 章（一辈子的关系模板）。\n- 收益：70 项研究的荟萃：敏感性干预 d=0.33、依恋安全 d=0.20；中短程＋行为聚焦最有效。25 个 RCT 的更新：依恋安全 r=.23；26 个 RCT：安全依恋 OR=1.85、混乱型 OR=0.54。\n- 证据等级：A\n- 来源：Bakermans-Kranenburg MJ, van IJzendoorn MH, Juffer F (2003). Less Is More. Psychological Bulletin 129(2). https://pubmed.ncbi.nlm.nih.gov/12696839/ ；Wright B, et al. (2023). Health Technology Assessment.\n- 备注：敏感回应的含义：接住情绪再纠正行为（「你生气了」先于「不许摔」）。视频反馈类课程（VIPP）效果最稳。\n\n### 4. 伤害孩子的是冲突，不是离婚本身\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=大 口径=心理健康 -->\n- 成本：改一个归因。\n- 说人话：离不离不是关键变量：全国 17 年的纵向追踪给出干净的分界——**低冲突**婚姻离了婚，成年子女的福祉变差；**高冲突**婚姻离了婚，子女反而更好。荟萃层面，离异子女的平均差距存在但小（约 0.14 个标准差）。所以「为了孩子忍着不离」在高冲突家庭是反的：孩子天天泡在冷战和互骂里，比离了更伤。\n- 收益：全国 17 年纵向：低冲突婚姻离婚使成年子女福祉变差，高冲突婚姻离婚反而改善。92 项研究荟萃：离婚组子女中位差 0.14 SD。\n- 证据等级：A\n- 来源：Booth A, Amato PR (2001). Parental Predivorce Relations and Offspring Postdivorce Well-Being. JMF 63(1). https://doi.org/10.1111/j.1741-3737.2001.00197.x ；Amato PR, Keith B (1991). Psychological Bulletin 110(1). https://doi.org/10.1037/0033-2909.110.1.26\n- 备注：「高冲突」的判据见第 2 章第 3 条（蔑视）——偶尔吵架不算，日复一日的敌意才算。离婚后的处理见第 5、6 条。\n\n### 5. 离婚后的养育有现成的项目，效果撑到 15 年\n<!-- 成本标签: 难受=中 时间=中 毅力=是 收益=大 口径=心理健康 -->\n- 成本：参加一个共养课程（书面的也行）。\n- 说人话：离异家庭最被验证的干预是「共养课程」（如 New Beginnings Program）：218 个家庭的随机试验，孩子当时 9-12 岁——15 年后，参加课程组的孩子内化障碍（抑郁焦虑类）15.5%，对照组 34.6%。课程内容并不神秘：教父母别拉孩子站队、别在孩子面前贬损对方、维持稳定日常。没钱上课的：把这三条当铁律自己执行。\n- 收益：RCT（218 个家庭，子女 9-12 岁入组）：15 年后子代内化障碍 15.5% vs 34.6%（OR=0.34）。6 年随访版：青少年 1 年精神障碍诊断率 11% vs 23.5%。\n- 证据等级：A\n- 来源：Wolchik SA, et al. (2013). Six-Year Follow-up of Preventive Interventions for Children of Divorce. JCCP 81(5). https://pubmed.ncbi.nlm.nih.gov/23750466/ ；Wolchik SA, et al. (2002). JAMA 288(15). https://doi.org/10.1001/jama.288.15.1874\n- 备注：944 个离异家庭的聚类分析：合作共养组孩子行为问题最少（多数其他结局与平行共养无显著差异——如实说，别夸大）。共养冲突的轨迹持续预测孩子的心理病理。\n\n### 6. 告诉孩子要离婚：直接、简短、一起说\n<!-- 成本标签: 难受=多 时间=少 毅力=些 收益=中 口径=心理健康 -->\n- 成本：一场难受但必要的谈话。\n- 说人话：怎么开口没有对照研究（如实说明），权威指南（美国儿童青少年精神医学会）的共识是：父母**一起**说、直接但简短（「我们决定分开住」）、反复保证三件事——不是你的错、爸爸妈妈都还是你的爸爸妈妈、生活的大框不变、想说随时可以问。别说细节、别要孩子评理、别宣布「你爸/你妈是坏人」。\n- 收益：无比较告知方式效果的实证研究（如实标注）。指南：AACAP《Children and Divorce》Facts for Families。\n- 证据等级：C\n- 来源：美国儿童青少年精神医学会 (AACAP). Children and Divorce. https://www.aacap.org/\n- 备注：C 级。跨时点的追踪：多数成年子女 20 年后报告与父亲的关系改善或稳定——当时觉得天塌，不是终点。\n\n### 7. 共同养育：别把孩子当传话筒\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=关系质量 -->\n- 成本：当面说不便的话，绕开孩子。\n- 说人话：93 项研究、4 万多人的荟萃给「共同养育」分了好坏成分：好的是合作与一致，坏的是**冲突、竞争、三角化**——最后这个就是「你去跟你爸说」：把孩子放进父母战壕中间。三角化对孩子的外化、内化问题都有独立预测。当面说不出口的，用文字工具（共养日程 App、固定的邮件）替代孩子传话。\n- 收益：93 项研究、41,207 人：共同养育与外化 r=−0.17、内化 r=−0.16；冲突/竞争/三角化为有害成分。\n- 证据等级：A\n- 来源：Zhao X, et al. (2022). The Longitudinal Relations Between Coparenting and Children's Adjustment. IJERPH 19(16). https://pubmed.ncbi.nlm.nih.gov/36011980/\n- 备注：与第 13 章第 5 条（别当传声筒）同一原理——上一代管婆媳，这一代管共养。在职父母的版本见第 6 章第 5 条（心理安全）。\n\n### 8. 多子女：被偏心的那个伤，偏爱也伤\n<!-- 成本标签: 难受=少 时间=中 毅力=是 收益=中 口径=心理健康 -->\n- 成本：检视自己的「隐形偏心」。\n- 说人话：多子女家庭研究里的「差异养育」（父母对孩子们明显不同）有独立于「平均养育水平」的坏效应：跟对立行为呈曲线关系——偏得越极端越糟，**被偏爱的那个也一起糟**。人到老年还被「当年偏心」硌着的：608 名老年人的数据，兄弟姊妹冲突与父母偏心预测更高的抑郁、孤独。分配表扬、零花钱、耐心时的自查：孩子们眼里对不对等。\n- 收益：599 个多子女家庭：差异养育独立于平均养育解释方差，与对立行为呈曲线关系（越极端越糟）。608 名老年人：兄弟姊妹冲突与父母偏心→抑郁/焦虑/敌意/孤独更高，亲密→孤独更低。\n- 证据等级：B\n- 来源：Meunier JC, Bisceglia R, Jenkins JM (2012). Mothers' and Fathers' Differential Treatments. Dev Psychol 48(2). https://pubmed.ncbi.nlm.nih.gov/22122474/ ；Stocker CM, et al. (2020). Sibling Relationships in Older Adulthood. J Fam Psychol 34(2). https://doi.org/10.1037/fam0000586\n- 备注：观察性设计。「公平」不是完全一样（年龄不同需求不同），是「各有各的被看见」。\n\n### 9. 帮害羞的孩子交朋友：约玩伴，别报班\n<!-- 成本标签: 难受=少 时间=中 毅力=些 收益=中 口径=关系质量 -->\n- 成本：每周组织一次一对一玩伴局。\n- 说人话：社交技能训练班对害羞孩子的效果普遍小、还难迁移到真实场域；真正有用的证据在「父母下场安排」：父母辅助的友谊训练（教孩子当好「玩伴局主人」：邀请、开场、轮流）对照延迟治疗的试验里，87% 的孩子至少一项指标可靠改善。家庭版操作：固定的一对一玩伴时间（比大集体安全）、孩子来当「小主人」（选活动、分零食）、结束在高潮处收尾。\n- 收益：父母辅助 Children's Friendship Training 对照试验：后测 87% 儿童至少一项指标可靠改善、3 个月 66.7%。社交技能训练 meta：效应小、难迁移。\n- 证据等级：B\n- 来源：Frankel F, et al. (2010). Journal of Autism and Developmental Disorders. https://pubmed.ncbi.nlm.nih.gov/20058059/ ；Gresham FM, Sugai G, Horner RH (2001). Exceptional Children 67(3). https://doi.org/10.1177/001440290106700303\n- 备注：原研究人群是社交困难儿童，外推到普通害羞儿童方向可用、幅度存疑。被霸凌的处理见原书第 30 节。\n\n### 10. 你的手机也在打断孩子\n<!-- 成本标签: 难受=0 时间=0 毅力=些 收益=中 口径=关系质量 -->\n- 成本：陪孩子时手机放远。\n- 说人话：technoference（设备干扰亲子互动）有儿童版数据：170 个家庭的追踪显示，父母的问题性用机越多，孩子 3 年后的外化和内化问题越多——机制链是「设备打断陪伴→孩子行为问题」。亲子时间的质比量敏感，家庭晚餐的氛围账见第 12 条。\n- 收益：170 个家庭（童均 3 岁）：父母问题性用机→technoference→子女外化/内化问题。183 对夫妻 4 波研究：儿童行为与父母用机干扰双向循环。\n- 证据等级：B\n- 来源：McDaniel BT, Radesky JS (2018). Technoference. Child Development 89(1). https://pubmed.ncbi.nlm.nih.gov/28493400/\n- 备注：相关/纵向设计。别把这条当「父母有罪」——是低成本的改进点：陪玩的 30 分钟手机静音放远处（第 1 章第 17 条的亲子版）。\n\n### 11. 青春期的隐私：要知情，别监控\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=关系质量 -->\n- 成本：忍住翻手机和查岗。\n- 说人话：瑞典经典研究拆穿了一个迷信：父母「知道得多」的孩子过得好——但知情的主要来源是**孩子愿意说**，不是父母查得严。后续研究补刀：侵入型监控（偷看、追踪、盘问）组合的孩子，负互动更多、母亲实际知道的反而更少。青春期的隐私是信任的产品，不是信任的敌人。管住底线（安全、作息、大额消费），其余用「饭桌上随口聊」换情报。\n- 收益：瑞典大样本：父母知情主要来自子女自愿披露。174 个家庭：侵入型母子组合→负互动更多、母亲知情下降；窥探频率低于询问，但与家庭功能问题关联更强。\n- 证据等级：B\n- 来源：Kerr M, Stattin H (2000). What Parents Know, Why They Know, and How It Matters. Dev Psychol 36(3). https://doi.org/10.1037/0012-1649.36.3.366 ；Rote WM, Smetana JG (2018). Dev Psychol 54(11). https://pubmed.ncbi.nlm.nih.gov/30265033/\n- 备注：撒谎的研究（保密/披露与信任）同向。例外：有安全风险的信号（自伤、被诱导），参照第 16 章第 10 条（未成年网络性侵害）。\n\n### 12. 家庭晚餐：氛围比次数重要\n<!-- 成本标签: 难受=0 时间=多 毅力=些 收益=中 口径=心理健康 -->\n- 成本：每周固定几次同桌吃饭。\n- 说人话：家庭晚餐的名声很大、效应量其实小而杂：20 万儿童的营养荟萃里，频率与饮食质量相关 r=.13——但氛围、时长与结果的关联同样级别。青少年心理的关联部分经得起固定效应检验，但多数不延续到成年，「家庭聚餐魔法」很多是「家庭功能正常」的果不是因。结论：值得做（低成本、有仪式感——第 13 章第 10 条），不值得焦虑（做不到每晚，别自责）。\n- 收益：57 项研究、203,706 名儿童：晚餐频率与饮食质量 r=.13；50 项研究、49,137 人：氛围 r=.13、时长 r=.20。17,977 名青少年的 3 波数据：与抑郁/物质使用显著相关，部分经固定效应检验，不延续到成年。\n- 证据等级：A\n- 来源：Dallacker M, Hertwig R, Mata J (2018). The Frequency of Family Meals and Health. Obesity Reviews 19(5). https://doi.org/10.1111/obr.12659 ；Musick K, Meier A (2012). Assessing Causality and Persistence in Associations Between Family Dinners and Adolescent Well-Being. JMF 74(3). https://doi.org/10.1111/j.1741-3737.2012.00973.x\n- 备注：相关设计的经典陷阱案例，如实呈现。餐桌上的纪律别太严——氛围那条 r 才是可操作位。\n","# 16. 别在网上把自己交出去\n\n网恋、约会软件、AI 换脸——关系的大半开头发生在网上，骗局的大半也发生在网上。本章讲怎么防：识别杀猪盘、保护隐私、对付跟踪软件。法律按中国大陆现行规定写。口径：人身安全、金钱、人身自由。\n\n### 1. 认识对象的渠道已经变天\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=时间精力 -->\n- 成本：改一个观念。\n- 说人话：「网上认识的不靠谱」这说法过时了：2017 年的全国代表性调查里，网络认识已是异性恋伴侣的第一大认识渠道（约 39%），同性伴侣里约 65%。渠道本身不筛好坏，筛人的规则在第 8 章第 1 条（口头标准不作数、行为才算数）。\n- 收益：2017 年美国全国代表性调查：网络认识约 2013 年超过朋友介绍、成为异性恋第一途径（2017 约 39%、同性约 65%）。\n- 证据等级：A\n- 来源：Rosenfeld MJ, Thomas RJ, Hausen S (2019). Disintermediating Your Friends. PNAS 116(36). https://doi.org/10.1073/pnas.1908630116\n- 备注：此后未更新的全国数据；中国的同类全国调查未核到。约三分之二的恋情起于友谊（含线下友谊——见第 8 章第 2 条）。\n\n### 2. 认识「杀猪盘」：恋爱开场，投资收尾\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=大 口径=金钱 -->\n- 成本：记住这个结构。\n- 说人话：最贵的感情骗局有固定剧本：人设完美（成功、体贴、距离刚好）、几周高浓度甜言（「精准投喂」）、然后自然地引向「带你赚钱」——小额返甜头、大额进平台，提现时被告知要交「税」「保证金」。公安部的口径里，「虚假网络投资理财类」诈骗占全部损失的约三分之一。识别只看一条：**建立期不谈钱、谈钱就不是恋爱**。恋爱对象的任何「稳赚渠道」，答案只有一个：不投。\n- 收益：公安部 2023 年十大高发类型：虚假网络投资理财类损失金额最大、约占损失 1/3；十大类发案占比近 80%；2022 年侦破 46.4 万起、紧急拦截涉案资金 3,180 余亿元。话术的阶段化模型见诈骗说服研究。\n- 证据等级：B\n- 来源：公安部 (2023-06-15). 十大高发诈骗类型. ；Whitty MT (2013). The Scamsphere. British Journal of Criminology. https://doi.org/10.1093/bjc/azt009\n- 备注：无「杀猪盘」单独官方统计，官方口径为「虚假网络投资理财类」。中国受害者的实证研究（含民警访谈）2025 年已发表。\n\n### 3. 谁在被骗：不是「孤独的傻子」\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：放下受害者滤镜。\n- 说人话：恋爱诈骗受害者的画像跟流行想象相反：研究里多是**中年、高学历女性**，共同点是高信任、易紧迫（「过了今天就没机会了」）；预测受害更强的是「浪漫理想化」——相信命中注定。这不是智力问题，是攻击面问题：精心准备的剧本对谁都够用。亲友该做的是发现「恋爱中的对方从不视频」这类信号时直说，不是事后嘲笑。\n- 收益：受害者研究：多为中年、高学历女性，更冲动、高信任；N=1,250：浪漫理想化预测受害；孤独感与「未损失金钱受害者」的情绪困扰相关（⚠ 不是受害本身的主要预测）。\n- 证据等级：B\n- 来源：Whitty MT (2018). Who Is Being Scammed? Cyberpsychology, Behavior, and Social Networking. https://doi.org/10.1089/cyber.2016.0729 ；Whitty MT, Buchanan T (2013). Criminal Justice Studies. https://doi.org/10.1080/1068316X.2013.772180\n- 备注：别拿「孤独导致被骗」劝人——证据不支持，还堵住了受害者开口。\n\n### 4. 装上反诈的三件套\n<!-- 成本标签: 难受=0 时间=少 毅力=否 收益=大 口径=人身安全 -->\n- 成本：下载、登记、接电话。\n- 说人话：三件现成的公共工具：①反诈专线 **96110**——它打来一定要接（那是预警劝阻电话，说明系统已识别你在跟高危账户通话）；②国家反诈中心 APP（来电预警、涉诈 App 检测）；③快速止付——发现被骗**立即打 110**，反电诈法给公安配了紧急止付和快速冻结（第 20 条），报得越快，钱追回的概率越大。这些在法律上不是劝导是制度（第 34 条的预警劝阻体系）。\n- 收益：《反电信网络诈骗法》（2022-12-01 施行）：第 20 条（即时查询、紧急止付、快速冻结、资金返还）、第 34 条（预警劝阻系统＋追赃挽损）、第 30 条（举报奖励）。96110 为公安部刑侦局全国预警劝阻咨询电话。国家反诈中心 APP 开发方为公安部刑事侦查局。\n- 证据等级：A\n- 来源：《中华人民共和国反电信网络诈骗法》 http://www.npc.gov.cn/c2/c30834/202209/t20220902_319186.html ；公安部\n- 备注：转账前的自检三问：对方视频过吗（拒绝视频的「恋人」一律按骗处理）、平台能公开查到吗、赚钱为什么要带你？AI 换脸的应对见第 11 条。\n\n### 5. 私密照片：发出去就收不回来\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=大 口径=人身安全 -->\n- 成本：一次克制。\n- 说人话：法律管得住传播，管不住像素：偷拍、散布他人隐私照片，治安处罚（拘留＋罚款）；情节重的构成传播淫秽物品罪；以裸照敲诈的，第 6 条单独说。但维权的前提是「发出去」这件事没发生——你自己就是唯一的防线：**不发**（对方说「只我一个人看」不构成技术保证）；已发出的，删除不等于销毁，截图、云备份、转发都在你控制之外。被威胁立即报警，不要先用「给一笔钱消灾」谈判。\n- 收益：《治安管理处罚法》（2026-01-01 施行）第 50 条第(六)项：偷窥、偷拍、窃听、散布他人隐私→5 日以下拘留或 1000 元以下罚款，较重 5-10 日可并罚；《刑法》第 364 条（传播淫秽物品，向未成年人传播从重）。网络暴力信息治理规定（2024-08-01 施行）：网暴信息含「侵犯隐私」类。举报通道：12377（中央网信办违法和不良信息举报中心）。\n- 证据等级：A\n- 来源：《治安管理处罚法》 http://www.npc.gov.cn/npc/c2/c30834/202506/t20250627_446254.html ；www.12377.cn\n- 备注：账号被盗后的处置（第 1 步做什么）见原书第 14 节。未成年人被诱导发照片——按第 10 条处理，性质是性侵害。\n\n### 6. 裸聊敲诈：一分钱都别给\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=大 口径=金钱 -->\n- 成本：记住这一条。\n- 说人话：视频裸聊被录屏、然后「不给钱就发给你通讯录所有人」——这是成建制的犯罪（2026 年江西判的团伙 16 人，主犯 13 年 6 个月），不是某个「吓唬你」的个人。它的杠杆全在「给第一笔」上：给了就证明你怕、你的通讯录值得继续榨。正确动作固定三条：不给钱、留证据（账号、转账要求截图）、立即报警——警方对这类套路熟得很，报警的代价远小于想象。\n- 收益：裸聊敲诈团伙获刑案例（16 人，主犯有期徒刑 13 年 6 个月，2026 年判）；警方提示：勿信网络恋情、勿暴露个人隐私、勿轻易转账。\n- 证据等级：A\n- 来源：江西政法网 (2026-02-03). https://www.jxzfw.gov.cn/2026/0203/2026020369229.html\n- 备注：案例页有失效风险，引用前核对。「面子」是这套骗局最大的资产——报警让它清零。\n\n### 7. 偷装定位和监控软件：这是刑事犯罪\n<!-- 成本标签: 难受=少 时间=少 毅力=否 收益=大 口径=人身安全 -->\n- 成本：发现时的果断。\n- 说人话：给伴侣手机装定位、监控软件（「查岗 App」）不是「爱的看管」：非法获取他人行踪轨迹信息满 50 条即构成侵犯公民个人信息罪——一次安装连续定位就够数。民法典同样保护私人生活安宁与私密活动。发现自己被装了：别声张先取证（录屏 App 行为）、换机、报警。\n- 收益：刑法第 253 条之一＋两高 2017 年解释第 5 条：非法获取行踪轨迹信息 50 条以上（或致其被用于犯罪）即「情节严重」，构成侵犯公民个人信息罪。民法典第 1032、1033 条（私人生活安宁、私密活动）。\n- 证据等级：A\n- 来源：最高人民检察院 (2017). https://www.spp.gov.cn/zdgz/201705/t20170510_190149.shtml\n- 备注：「手机给你随便查」的另一面见第 18 章第 3 条（拒绝敏感）。谁在装：下一把尺子。\n\n### 8. 「技术助虐」比想象中常见\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=人身安全 -->\n- 成本：认这个量级。\n- 说人话：用技术控制伴侣（定位、翻手机、社交账号监控、GPS 追踪器）有个学术名字叫 TFA（technology-facilitated abuse）：澳大利亚全国样本里，终身遭遇过任一形式的接近一半。它跟家暴同源（第 4 章的控制信号），数字化只是换了武器。国内无对应流行率数据——但工具是同一批工具。\n- 收益：澳大利亚全国样本（n=4,562）：TFA 终身受害率约 1/2；范围综述支持其与亲密伴侣暴力共现。\n- 证据等级：B\n- 来源：Flynn A, Powell AN, Hindes S (2023). Technology-Facilitated Abuse. British Journal of Criminology. https://doi.org/10.1093/bjc/azad044\n- 备注：⚠ 中国数据未找到。取证与报案路径同第 4 章。别把这条当成「装反诈 APP 的理由」——受害方是关系的另一方，不是手机。\n\n### 9. 第一次见网友：白天、公共场合、朋友知情\n<!-- 成本标签: 难受=0 时间=0 毅力=些 收益=中 口径=人身安全 -->\n- 成本：几个约束条件。\n- 说人话：线上聊得再久，第一面仍是零核实。约定俗成的安全清单（官方页面未汇总，按多方警方建议归并——C 级）：白天、人多公共场合（商场咖啡厅优于私密餐厅）、自带交通（不坐对方车）、位置共享给一个朋友、饮料不离手。任何时候想走就走，无需理由。见面前至少视频过一次（拒视频=高危信号，见第 2 条）。\n- 收益：无统一官方建议页（如实标注）；96110 与反诈 APP 为官方可依赖工具。\n- 证据等级：C\n- 来源：经验做法（各地警方提示归并）；配套见第 3、4 条。\n- 备注：C 级。约会 App 本身无全国性婚恋安全专门规章——实名制（网安法）与 App 备案是通用框架，见核实记录。\n\n### 10. 未成年人被诱导发私密内容：这是性侵，立即报案\n<!-- 成本标签: 难受=少 时间=少 毅力=否 收益=大 口径=人身安全 -->\n- 成本：认性质、走流程。\n- 说人话：成人以「谈恋爱」「给零花钱」诱导未成年人发私密照片、裸露视频——司法实践明确按猥亵儿童罪或强制猥亵罪处理（2023 年两高司法解释第 9 条，网络「隔空」实施的同样定罪）。发现孩子遭遇：先稳住情绪（孩子的最大恐惧是被骂）、截图全部证据（账号、转账、对话）、立即报警（不需要先「内部消化」）。另有专门条文管「负有照护职责人员」对已满 14 不满 16 岁未成年人的性侵。\n- 收益：法释〔2023〕3 号第 9 条：胁迫、诱骗未成年人通过网络视频聊天或发送视频、照片等暴露身体隐私部位或实施淫秽行为，以强制猥亵罪或猥亵儿童罪定罪处罚。刑法第 236 条之一：负有照护职责人员性侵罪（监护、收养、看护、教育、医疗等特殊职责人员，对已满 14 不满 16 周岁未成年女性）。\n- 证据等级：A\n- 来源：《最高人民法院、最高人民检察院关于办理强奸、猥亵未成年人刑事案件适用法律若干问题的解释》（法释〔2023〕3 号，2023-06-01 施行） https://www.court.gov.cn/zixun/xiangqing/401002.html\n- 备注：强制报告（第 4 章第 17 条）适用于学校、医疗机构等密切接触行业。孩子的心理支持走 12355（青少年服务台）与专业心理咨询。\n\n### 11. 别信眼见为实：AI 换脸拟声诈骗\n<!-- 成本标签: 难受=0 时间=0 毅力=些 收益=大 口径=人身安全 -->\n- 成本：多一道验证习惯。\n- 说人话：「视频里的儿子」「语音里的领导」都可能是合成的：深度合成内容管理规定与 2025 年的标识办法要求 AI 生成内容显著标识，但骗子不会守规矩。涉及转账、借钱的「视频通话」，加一道独立信道验证（回拨对方常用号码、问只有本人知道的事）。AI 换脸拟声诈骗的处置与识别，原书第 8 节有专条——那边按中国现行规定写全了。\n- 收益：《互联网信息服务深度合成管理规定》（2023-01-10 施行）；《人工智能生成合成内容标识办法》（2025-09-01 施行）＋强制国标 GB 45438-2025；民法典第 1019 条（利用信息技术手段伪造侵害肖像权）、第 1023 条第 2 款（声音保护参照肖像权）。\n- 证据等级：A\n- 来源：国家互联网信息办公室 https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm ；《高性价比人生指南》第 8 节 https://github.com/eternity4719/HowToLiveBetter\n- 备注：法条与规定会持续更新，引用带截至日期。给家里老人设「转账暗号」是低成本的家庭防线。\n","# 17. 婚姻的经营与修复\n\n婚姻是本书唯一「项目级」的关系：有分工、有财务、有维修需求。本章讲三件事：日常经营（家务、钱、仪式）、维修（伴侣咨询）、大修（出轨之后）。口径：关系质量、金钱、寿命、心理健康。\n\n### 1. 家务：公平感比分工表重要\n<!-- 成本标签: 难受=中 时间=少 毅力=些 收益=中 口径=时间精力 -->\n- 成本：一场分工谈判。\n- 说人话：家务影响婚姻的机制不是「谁做了多少」，是「各人觉得公不公平」：早期调查里平权分工的夫妻性频率更低，新调查显示差异消失——机制已经从分工本身转向感知公平。还有一个反直觉的发现：**共同承担同一任务的种类数**（一起买菜、一起收拾）比各管一摊更预测关系质量。实操：分工表可以列，但每季度对一次「你觉得亏不亏」；一起干比分着干好。\n- 收益：MARS 调查（约 487 对）：传统分工的性频率差异消失，机制转向感知公平。共同承担同一任务的种类数（而非各做多少）预测双方关系质量。\n- 证据等级：B\n- 来源：Carlson DL, Miller AJ, Sassler S, Hanson KL (2016). JMF 78(1). https://doi.org/10.1111/jomf.12313 ；Carlson DL, et al. (2022). Sex Roles. https://doi.org/10.1007/s11199-022-01282-5\n- 备注：观察性调查。钱的家务（谁管账）见第 2 条。\n\n### 2. 「男人多做家务性更多」是误传\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=小 口径=时间精力 -->\n- 成本：省下被营销号的误导。\n- 说人话：流行说法「丈夫多做女性化家务，妻子性欲更高」把研究读反了：原研究（全国家庭调查）的结论方向是——丈夫不做「女性化」核心家务的传统分工夫妻性频率**更高**，作者明确反驳「家务换性」的交换论；后续新调查里这种差异也消失了。家务值不值得做？值得（第 1 条的公平感）——但别拿性当家务的工资条，哪个方向都不是。\n- 收益：NSFH2 调查：丈夫不做「女性化」核心家务的传统分工夫妻性频率更高（作者明确反驳交换论）；2006 年调查中该差异消失。两文摘要均无次数差数值。\n- 证据等级：B\n- 来源：Kornrich S, Brines J, Leupp J (2013). Egalitarianism, Housework, and Sexual Frequency in Marriage. ASR 78(2). https://doi.org/10.1177/0003122412472340\n- 备注：反面/澄清条目。相关数据、争议未决，如实呈现。\n\n### 3. 钱合着管：有随机实验支持的婚姻决策\n<!-- 成本标签: 难受=少 时间=少 毅力=否 收益=中 口径=金钱 -->\n- 成本：开一个共同账户。\n- 说人话：AA 还是合管？这个问题难得有实验级证据：230 对原本各自管钱的订婚/新婚夫妻，随机分成「开共同账户」「维持分开」「自选」三组——两年后，共同账户组的婚姻质量显著更高（维持了蜜月期水平，分开组下滑），机制是财务目标一致与透明。适用边界注意：这是「新起步」的夫妻；多年 AA 运行良好的不必翻桌。折中方案常见的是「共同账户＋各自零花钱」。\n- 收益：随机实验（230 对，六波追踪）：共同账户组 2 年后关系质量显著高于分开组（维持蜜月期水平），机制为财务目标一致与透明。\n- 证据等级：A\n- 来源：Olson JG, Rick SI, Small DA, Finkel EJ (2023). The Relationship Between Money and Marriage. Journal of Consumer Research 50(4). https://doi.org/10.1093/jcr/ucad020\n- 备注：精确效应量请对原文核对（原文页被出版商屏蔽）。财务分歧作为最强离婚预测因子的账见第 3 章第 3 条。\n\n### 4. 伴侣治疗有效：七成获益，流派不重要\n<!-- 成本标签: 难受=中 时间=多 毅力=是 收益=大 口径=心理健康 -->\n- 成本：十几到几十次咨询的费用与时间。\n- 说人话：婚姻「病了」找咨询不是最后手段：30 个随机对照试验的荟萃——婚姻治疗的平均效应 d=0.59（「明显好转」量级），综述口径约 25-30% 的夫妻无获益（即约七成获益）。流派之争可以放下：情绪聚焦（EFT）后测 g=0.73、行为派 0.53，都显著、各有强项；长期看 6 个月后仍有 0.44。贵的不是咨询是拖延（第 5 条）。\n- 收益：30 个 BCT RCT 荟萃：d=0.585；综述：25-30% 无获益。EFT 荟萃（33 个 RCT、2,730 人）：后测 g=0.60（EFT 0.73/BCT 0.53），6 个月 0.44，12 个月行为派仅 0.06。\n- 证据等级：A\n- 来源：Shadish WR, Baldwin SA (2005). JCCP 73(1). https://doi.org/10.1037/0022-006X.73.1.6 ；Rathgeber M, et al. (2019). The Efficacy of Emotionally Focused Couple Therapy. JMFT 45(3). https://doi.org/10.1111/jmft.12336\n- 备注：小样本发表偏倚存在（原文自述）。线上项目同样有效且便宜（第 6 条）。怎么找靠谱咨询师见原书第 24 节（看病路径可平移）。\n\n### 5. 拖延才是最贵的：平均已拖 2.68 年\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=中 口径=时间精力 -->\n- 成本：把「再看看」改成「这周约」。\n- 说人话：「忍到孩子高考再说」的代价没有研究直接量化，但有基准：夫妻从问题出现到走进伴侣咨询，平均拖 2.68 年，多数在 2 年内就诊；流传的「平均拖 6 年」是作者原话「广被引用但证据薄弱」的传说。问题在拖延期是复利的（第 2 章的敌意冲突、第 4 章的恶性升级都在计息）。分歧到「谈不出、躲着谈」级别的，本周就约。\n- 收益：调查（N=270）：从问题出现到开始伴侣治疗平均 2.68 年，多数 2 年内就诊；「平均 6 年」说法证据薄弱。\n- 证据等级：B\n- 来源：Doherty WJ, Harris SM, Hall LA, Hubbard RL (2021). JMFT. https://doi.org/10.1111/jmft.12479\n- 备注：调查数据。费用敏感的走第 6 条（线上项目）与社区心理咨询。\n\n### 6. 婚姻体检与线上课程：低成本的预防\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=中 口径=金钱 -->\n- 成本：一年一次的检查/一门网课。\n- 说人话：病了才治是贵方案，体检是便宜方案：①「婚姻体检」（Marriage Checkup）——356 对夫妻的随机试验显示在线项目对关系满意度、抑郁、焦虑都有改善（组内 d=.43-.71）；上门版（215 对、2 年）对亲密度 d=0.20-0.55；②婚前/婚内教育课程的效果（第 8 章第 7 条：d=.30-.45）同样平移到婚后。低教练支持的网课与高支持效果相当，只是脱落多——约个人同看、定日程。\n- 收益：RCT（356 对）：在线伴侣项目组内 d=.43-.71（关系满意度、抑郁、焦虑）；低/高教练支持效果相当。RCT（215 对、2 年）：Marriage Checkup 亲密度组间效应 d=0.20-0.55。\n- 证据等级：A\n- 来源：Roddy MK, et al. (2018). Behaviour Research and Therapy. https://doi.org/10.1016/j.brat.2018.09.002 ；Córdova JV, et al. (2014). JCCP. https://doi.org/10.1037/a0037097\n- 备注：纯自助书籍的效果证据薄弱（如实说——结构化课程行，书本身没人做过 RCT）。亲密关系日常维护见第 1 章。\n\n### 7. 健康会「传染」：一起戒、一起瘦\n<!-- 成本标签: 难受=中 时间=多 毅力=是 收益=大 口径=寿命 -->\n- 成本：两个人一起改习惯。\n- 说人话：伴侣是健康行为的最大环境变量：Framingham 队列 1.2 万人里，配偶戒烟成功，本人继续吸烟的几率降 67%；随机试验里只给一人上减肥课，没上课的配偶一年也瘦了 2.2 公斤（对照组 0.2）。反过来，一个人的坏习惯也这样传染。健康习惯的谈判句式不是「你该减肥了」，是「咱俩一起」。\n- 收益：Framingham 网络（12,067 人、1971-2003）：配偶戒烟使本人继续吸烟几率降 67%（95%CI 59-73）。RCT（Look AHEAD）：只治一人，未治疗配偶 12 个月也减重 2.2 vs 0.2 kg（p<0.001），≥5% 减重者 26% vs 9%。\n- 证据等级：A\n- 来源：Christakis NA, Fowler JH (2008). The Collective Dynamics of Smoking. NEJM 358:2249. https://doi.org/10.1056/NEJMsa0706154 ；Gorin AA, et al. (2008). Spousal Contagion. Int J Obes. https://doi.org/10.1038/ijo.2008.150\n- 备注：观察性（Framingham 有社会网络法争议）＋实验（Gorin）双保险。共同睡眠的账见第 8 条。\n\n### 8. 同床的睡眠账：既同步也被打扰\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=寿命 -->\n- 成本：按数据选床型。\n- 说人话：夫妻同床对睡眠是「改变」不是单向的好或坏：实验室双 PSG 研究发现同床时快速眼动睡眠（REM）更多更稳、两人的睡眠结构同步；但大样本综述同样确认「被伴侣打扰」（鼾声、翻身、作息差）真实存在。怎么选看个人：睡眠浅的参考分房（第 10 章第 8 条：分房不是感情问题），亲密敏感的记住同床有生理红利；折中是「同床不同被」。\n- 收益：12 对伴侣实验室双 PSG：同床 REM 增加且更稳定、睡眠结构同步（p=0.005）；SHHS n=5,804：已婚者 REM 更高；系统综述：4/4 研究证实被伴侣干扰、2/3 见同床 REM 增加；伴侣睡眠-觉醒一致率 53-88%；睡眠效率与次日关系功能双向关联。\n- 证据等级：B\n- 来源：Drews HJ, et al. (2020). Bed-Sharing. Frontiers in Psychiatry 11:583. https://doi.org/10.3389/fpsyt.2020.00583 ；Hasler BP, Troxel WM (2010). Psychosomatic Medicine 72(8). https://doi.org/10.1097/PSY.0b013e3181ecd08a\n- 备注：实验室样本小、真实世界数据混杂。打鼾的医学处理（睡眠呼吸暂停）见原书第 2 节与第 24 节。\n\n### 9. 空巢是婚姻的反弹期\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：校准预期。\n- 说人话：孩子离家被叫「空巢危机」，纵向数据画的是反弹：Mills 女性队列 18 年追踪，中年婚姻满意度上升——空巢带来的提升走的是「更享受与伴侣相处」，不是相处时间变多。把「孩子走了」当婚姻第二幕的开幕：第 1 章的维护动作这时收益最高。注意性别与单性别样本的局限（见备注）。\n- 收益：Mills 女性纵向队列（18 年）：中年婚姻满意度上升；空巢经「更享受与伴侣相处」而非相处时长提升满意度。\n- 证据等级：B\n- 来源：Gorchoff S, John O, Helson R (2008). Psychological Science 19(11). https://doi.org/10.1111/j.1467-9280.2008.02222.x\n- 备注：单性别（女性）队列。空巢期父母的孤独与社交重建见第 5 章、第 7 章第 5 条。\n\n### 10. 出轨的真实发生率：看口径，别看段子\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：校准一个数字。\n- 说人话：美国全国调查的自报口径：已婚男性约 20%、女性约 13% 承认一生有过婚外性行为。自报方式影响巨大：同一研究里，面访口径出轨率 1.08%，电脑匿名自填 6.13%——差 6 倍。中国没有公开可复核的全国行为数据（调查多为态度题），网上流传的具体百分比别引用。用这条干什么：把「肯定不是我伴侣」和「人均出轨」两个极端都收起来。\n- 收益：GSS（2010-2016）：已婚男性 20%、女性 13% 自报终身婚外性；期刊综述口径 22-25% 男/11-15% 女。N=4,884 已婚女性：面访 1.08% vs 电脑匿名自填 6.13%（过去一年）。\n- 证据等级：A\n- 来源：Wolfinger N (2018). Who Cheats More? IFS. https://ifstudies.org/blog/who-cheats-more-the-demographics-of-cheating-in-america ；Whisman MA, Snyder DK (2007). Fam Process. https://doi.org/10.1111/famp.12185\n- 备注：中国数据标 B/C——「中国私人生活调查」有决定因素分析但摘要未报发生率，明写「无公开可复核率」。\n\n### 11. 出轨被发现后：保密的婚姻最危险\n<!-- 成本标签: 难受=多 时间=多 毅力=是 收益=大 口径=关系质量 -->\n- 成本：一场坦白（或一场发现）。\n- 说人话：出轨婚姻的结局数据出人意料：随机试验的治疗样本里 5 年追踪——**保密未披露组 80% 离婚**、已披露组 43%、无出轨组 23%；已披露组治疗结束时的满意度改善幅度甚至大于无出轨组。注意样本极小（保密组仅 5 对），但方向与临床共识一致：吞噬婚姻的是秘密的长利息，不是事件本身。披露≠细节轰炸（「几次、在哪、怎么」的问诊式拷问双方都受创）。\n- 收益：RCT 衍生 5 年追踪（19 对出轨夫妻）：保密未披露组 80% 离婚（4/5）、已披露组 43%（6/14）、无出轨组 23%；5 年后仍婚的出轨夫妻满意度与无出轨夫妻无差异且持续上升。\n- 证据等级：A\n- 来源：Marín RA, Christensen A, Atkins DC (2014). Infidelity's Aftermath. Couple & Family Psychology 3(1). https://doi.org/10.1037/cfp0000012\n- 备注：⚠ 保密组仅 5 对，量级当方向看；「已披露」含主动坦白与被发现。出轨再犯风险（前段出过轨，下段 3 倍）另案处理——那是选择与情境的复合。\n\n### 12. 被出轨的一方：创伤是真的，可治的也是真的\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=大 口径=心理健康 -->\n- 成本：承认这是伤，不是「想开点」。\n- 说人话：发现伴侣出轨后的心理反应是创伤级的：全国样本里，发现伴侣出轨的人过去一年重性抑郁发作的几率约为 5 倍（校正婚姻调适后仍近 5 倍）；年轻样本里 45% 达「疑似出轨相关 PTSD」。这些数字的意义是：你的崩溃是正常反应，值得专业的帮助（第 4 条的伴侣治疗＋个体咨询），不是「不够大度」。修复期没有标准时长（临床共识 1-2 年，无实证）。\n- 收益：全国概率样本（NCS-2）：发现伴侣出轨→过去年重性抑郁发作 OR=10.0（人口学校正）、OR=4.85（再校正婚姻调适）。N=73 未婚年轻人：45.2% 达「疑似出轨相关 PTSD」。\n- 证据等级：A\n- 来源：Whisman MA (2016). Discovery of Partner Infidelity. Family Process 55(4). https://doi.org/10.1111/famp.12185 ；Roos L, et al. (2019). Stress and Health 35(4). https://doi.org/10.1002/smi.2880\n- 备注：年轻样本为未婚群体。心理支持渠道见第 4 章第 19 条（12356）。\n\n### 13. 宽恕是可以练的技能\n<!-- 成本标签: 难受=多 时间=中 毅力=是 收益=大 口径=心理健康 -->\n- 成本：一套结构化练习。\n- 说人话：「原谅」不是道德姿态，是可以练的心理技术：54 项研究的荟萃——宽恕干预（Wade 的 REACH 流程等）显著提升宽恕度（效应量 0.56，对照积极治疗仍有 0.45），同时改善抑郁焦虑。注意它不等于和好：宽恕是受害方放下载重的心理动作，跟关系存续是两个决定。对方该做的部分另有清单：道歉的质量与被原谅相关 r=.42——六个成分说全（第 3 章第 4 条）。\n- 收益：54 项研究、N=2,323 的荟萃：宽恕干预 vs 无治疗 Δ+=0.56（0.43-0.68）、vs 其他积极治疗 0.45；抑郁焦虑亦显著改善（幅度小于宽恕效应）。原谅相关物的元分析（175 项研究、26,006 人）：道歉 r=.42、状态共情 r=.51、状态愤怒 r=−.41、性别 r=.01（几乎无差）。\n- 证据等级：A\n- 来源：Wade NG, Hoyt WT, Kidwell JE, Worthington EL Jr (2014). JCCP 82(1). https://doi.org/10.1037/a0035268 ；Fehr R, Gelfand MJ, Nag M (2010). Psychological Bulletin 136(5). https://doi.org/10.1037/a0019037\n- 备注：宽恕干预非出轨专项。单方决定离婚的流程见第 11 章第 19-22 条。\n","# 18. 关系里的心理困境\n\n依恋焦虑、拒绝敏感、抑郁时的退缩、「我是不是太敏感」——关系问题常常一半是心理机制。本章讲四个层面：性格底色（依恋）、反应模式（敏感、强迫怀疑）、状态（抑郁、自尊）、求助路径。口径：心理健康、关系质量。\n\n### 1. 依恋风格可以变，焦虑和回避都会降\n<!-- 成本标签: 难受=中 时间=多 毅力=是 收益=大 口径=心理健康 -->\n- 成本：主动的安全感练习（有时靠治疗）。\n- 说人话：「焦虑型」「回避型」不是终身判决：3 个纵向队列从少年追到老年——依恋焦虑随年龄下降、回避线性下降；**处于稳定的恋爱婚姻里的人，焦虑和回避都更低**（双向：安全的关系养人，人也变安全）。元口径：依恋稳定性 r=.39，一半以上的变异跟处境走。实操：焦虑型的解药是「可预期的回应」（第 1 章日常维护＋说清需求），回避型的解药是小步自我表露（第 5 章第 9 条）。\n- 收益：3 个纵向队列（N=628，13→72 岁）：焦虑随年龄下降（中老年尤甚）、回避线性下降；恋爱婚姻状态与更低焦虑/回避相关。127 篇研究、21,072 例：稳定性 r=.39；短期重测约 30% 改变分类。\n- 证据等级：A\n- 来源：Chopik WJ, Edelstein RS, Grimm KJ (2019). Changes in Attachment Across the Adult Lifespan. JPSP. https://doi.org/10.1037/pspp0000167 ；Pinquart M, Feußner C, Ahnert L (2013). Attachment & Human Development 15(2). https://doi.org/10.1080/14616734.2012.732369\n- 备注：自然变化为主，主动改变建议借助关系或治疗。先知道自己是哪种：任何免费的成人依恋量表都只是入门，别拿自测贴标签。\n\n### 2. 焦虑型伤冲突，回避型伤亲密\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=关系质量 -->\n- 成本：知道短板在哪。\n- 说人话：2.2 万人的荟萃把两种不安全依恋的破坏点分开了：对总体满意度、联结感、支持——**回避**的负面关联更强（人不在场，关系挨饿）；焦虑的破坏点在**冲突**维度（小事放大、要确认、易吵）。修法不同：焦虑型练「先把需求说小声说具体」（第 3 章），回避型练「在场」（一起做不需要深聊的事——第 1 章第 18 条）。配对的知识点：焦虑＋回避是互相喂养的锁死组合（对应第 2 章第 15 条的追逃循环）。\n- 收益：荟萃（73 研究、118 样本、21,602 人）：焦虑、回避均负向预测关系质量；对满意度/联结感/支持，回避的负关联强于焦虑；焦虑与冲突正相关更强。\n- 证据等级：A\n- 来源：Li T, Chan DK (2012). How Anxious and Avoidant Attachment Affect Romantic Relationship Quality Differently. European Journal of Social Psychology. https://doi.org/10.1002/ejsp.1842\n- 备注：相关设计。具体 r 值在正文表格，摘要未给。\n\n### 3. 拒绝敏感：等一条「已读不回」的审判\n<!-- 成本标签: 难受=少 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：认出这个模式。\n- 说人话：有人被拒绝一次，疼三天；对方回复慢，脑内已上演「他讨厌我」全剧——拒绝敏感（RS）是可测量的稳定特质，研究里它预测更低的关系满意度（双方都低）。它跟第 9 章第 5 条（已读不回）、第 12 章第 5 条（性拒绝的安抚式）是同一套机关。解法顺序：先怀疑解读（文字误读率一半），再要确认（「你刚才是生气了吗」），最后才是处理自己（认知治疗对这类自动念头是对症的）。\n- 收益：构念确立系列研究：高拒绝敏感者本人及伴侣满意度更低；后续研究关联恋爱冲突与暴力风险。\n- 证据等级：B\n- 来源：Downey G, Feldman SI (1996). Implications of Rejection Sensitivity for Intimate Relationships. JPSP 70(1). https://doi.org/10.1037/0022-3514.70.6.1327\n- 备注：⚠ 原始数字（N、前瞻效应）未核到（出版商屏蔽摘要）。RS 专项荟萃未找到。\n\n### 4. 抑郁时的社交退缩：循环的入口\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=大 口径=心理健康 -->\n- 成本：病中维持最低限度的联结。\n- 说人话：抑郁的经典机关是「先躲人」：情绪低落→取消聚会→更少正反馈→更低落（40 年前提出的循环，如今有 8.8 万人的孤独-抑郁荟萃撑腰）。中招时的纪律不是「振作社交」，是**保底联结**：每周一次、低耗能的见面（跟一个不要求你表演的人）；线上群聊不抵线下的账（第 5 章）。伴侣的版本：对方的抑郁期间，25-50% 的家属自己也需要支持——照顾者先系好自己的氧气面罩。\n- 收益：88 项研究、40,068 人的荟萃：孤独感与抑郁中等强度相关。家属研究（260 名配偶/亲属）：25-50% 持续担忧患者健康与安全、接手任务、关系紧张并常需就医。\n- 证据等级：A\n- 来源：Erzen E, Çikrikci Ö (2018). The Effect of Loneliness on Depression. Int J Soc Psychiatry. https://doi.org/10.1177/0020764018776349 ；van Wijngaarden B, et al. (2004). J Affect Disord 81(3). https://pubmed.ncbi.nlm.nih.gov/15240297/\n- 备注：机制经典为 Coyne 1976（理论）。抑郁的识别与就医见原书第 24 节与第 29 节；热线见第 4 章第 19 条。\n\n### 5. 高敏感：三成人中一成，不是病\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：放下「矫情」的自判。\n- 说人话：感觉加工敏感性（俗称高敏感）在大样本里分三组：高敏约三成、中敏四成、低敏近三成——高敏是被刺激压得更快满，不是缺陷也不罕见。证据状态如实说：量表与相关研究为主、没有随机试验；网上「高敏感人的十个小习惯」更是营销内容。给高敏的关系建议是工程学：预警（「今天我已经很满了」）、离场权（聚会中途撤退不算失礼）、恢复期（社交后独处回血——配第 5 章第 10 条）。\n- 收益：N=906 成人：潜在剖面三组——高敏 31%（orchid）、中敏 40%（tulip）、低敏 29%（dandelion）。\n- 证据等级：B\n- 来源：Lionetti F, et al. (2018). Dandelions, Tulips and Orchids. Translational Psychiatry. https://doi.org/10.1038/s41398-017-0090-6\n- 备注：以量表/相关研究为主，无 RCT，如实标 B。别拿「高敏感」当诊断或免罪牌——它是参数不是身份。\n\n### 6. 「我们到底合不合适」的强迫性怀疑\n<!-- 成本标签: 难受=多 时间=中 毅力=是 收益=中 口径=心理健康 -->\n- 成本：分清「疑虑」与「症状」。\n- 说人话：反复怀疑「我是不是不爱他了/我们是不是根本不合适」、检查一小时松一小时、越分析越焦虑——这可能不是关系出了问题，是「关系强迫」（ROCD）：小样本研究显示，控制了普通强迫症状后，这类怀疑仍与关系/性功能下降和情绪低落相关。区分的线索：疑虑由具体事件触发且能被证据安抚的是正常疑虑；循环出现、越想越焦虑、与幸福与否无关的是症状。后者按强迫症的路子治（认知行为治疗），不是按分手的路子。\n- 收益：22 名 ROCD 来访者 vs OCD vs 对照：ROCD 症状控制 OCD 症状后仍与关系/性功能下降及情绪低落相关。无患病率、无 RCT（如实标注）。\n- 证据等级：B\n- 来源：Doron G, et al. (2016). Relationship Obsessions in OCD. Frontiers in Psychiatry 7:58. https://doi.org/10.3389/fpsyt.2016.00058\n- 备注：小样本临床组。机制：依恋焦虑×关系型自我价值易感。确诊走精神科。\n\n### 7. 低自尊拖累关系，双向的\n<!-- 成本标签: 难受=中 时间=多 毅力=是 收益=中 口径=关系质量 -->\n- 成本：治自己的账。\n- 说人话：把关系问题全归到对方身上之前查一个变量：两个大样本（885 对 12 年＋6,116 对 15 年）的纵向共识——**双方的自尊预测共同满意度的起点和走势**，控制年龄健康就业后依然成立；方向以「自尊→关系」为主，反向较弱。好消息是这条和第 1 条连通：自尊能修（治疗、成就、被善待的关系都行），修自己等于修关系。\n- 收益：研究1：885 对×5 波×12 年；研究2：6,116 对×3 波×15 年：双方初始自尊预测共同满意度水平及变化；自尊相似性无效应；自尊→关系质量为主。\n- 证据等级：A\n- 来源：Erol RY, Orth U (2014). Development of Self-Esteem and Relationship Quality in Romantic Couples. Developmental Psychology 50(9). https://doi.org/10.1037/a0036029\n- 备注：⚠ Erol & Orth 2016 是综述，实证引 2014。机制文（Erol & Orth 2013, JRP）。\n\n### 8. 述情障碍：说不出感受的人怎么开口\n<!-- 成本标签: 难受=多 时间=中 毅力=是 收益=中 口径=关系质量 -->\n- 成本：练一套「翻译」系统。\n- 说人话：有人不是不想说，是**找不到词**——识别和描述自己的情绪有困难（述情障碍），纵向研究显示它预测之后更低的满意度、承诺和情感沟通。这类伴侣的适配工具不是逼问「你到底什么感受」，是降维：身体信号（「你现在胸口是闷还是紧？」）、量表（情绪轮盘图指认）、以及一个重要提示——述情可练（情绪标注训练），重度走心理治疗。\n- 收益：纵向研究：T1 述情障碍负向预测 T2 满意度、承诺、情感沟通及维持行为（理解、保证），反向模型不显著；经「理解」中介。\n- 证据等级：B\n- 来源：Hesse C, Gibbons JA (2019). Alexithymia and Romantic Relationships. Personal Relationships 26(4). https://doi.org/10.1111/pere.12294\n- 备注：摘要未给 N/效应量。给情绪命名的神经证据（标注降低杏仁核反应）见第 2 章第 7 条。\n\n### 9. 心理咨询总体有效：四分之三的位差\n<!-- 成本标签: 难受=多 时间=多 毅力=是 收益=大 口径=心理健康 -->\n- 成本：疗程费用。\n- 说人话：近 400 项对照研究的经典荟萃给出基线：接受心理治疗的典型来访者，结局好过 75% 的未治疗者（效应约 d=0.68）；各疗法类型之间差异很小——「找什么流派」远不如「开始治、且别频繁换」重要。关系困扰可以单独做个体咨询（不拖伴侣一起）；伴侣一起的见第 17 章第 4 条。\n- 收益：近 400 项对照研究的荟萃：典型来访者优于 75% 未治疗者（≈d 0.68）；疗法类型间差异小。\n- 证据等级：A\n- 来源：Smith ML, Glass GV (1977). Meta-Analysis of Psychotherapy Outcome Studies. American Psychologist 32(9). https://doi.org/10.1037/0003-066x.32.9.752\n- 备注：更晚的「d≈0.8」说法出自 Wampold 的书，按 B 引。挂号路径、少花冤枉钱见原书第 24 节；热线 12356（第 4 章第 19 条）。\n\n### 10. 内向不是需要修的毛病\n<!-- 成本标签: 难受=0 时间=0 毅力=否 收益=中 口径=心理健康 -->\n- 成本：拒绝对号入座的焦虑。\n- 说人话：「你要多social」式的劝告可以挡回去：人格荟萃显示外向性确实与幸福感相关，但它是「相关」不是「处方」——内向者的大多数照样过得好，幸福感的方差里人格只占一部分，处境和选择占剩下的。内向者要管理的是能量预算（社交预算学：第 5 章的固定见面、留恢复期），不是性格改造工程。\n- 收益：人格-幸福感荟萃：人格合计解释 SWB 方差 39%（校正后 63%）；MASEM（35 样本、22,135 人、14 国）：除开放性外各特质有独特预测。\n- 证据等级：A\n- 来源：Steel P, Schmidt J, Shultz J (2008). Refining the Relationship Between Personality and Subjective Well-Being. Psychological Bulletin 134(1). https://doi.org/10.1037/0033-2909.134.1.138\n- 备注：⚠「内向者多数仍幸福」是基于分布的口径推论，不是单篇引文。社恐（焦虑到回避）另案——第 5 章第 13 条。\n\n### 11. 想找人聊：先分诊，再开口\n<!-- 成本标签: 难受=少 时间=少 毅力=些 收益=大 口径=心理健康 -->\n- 成本：一次分诊。\n- 说人话：心理求助按三档分诊最省事：①**过不下去的当下**——12356 热线（免费、即刻、不用挂号）；②**状态持续差**（睡眠情绪两周以上不对）——医院心理科/精神科（先排除躯体问题、该用药用药）；③**具体困扰想谈**（关系、依恋、敏感）——心理咨询（第 9 条的疗效数据）。顺序反了最费钱：拿热线当长期治疗、拿咨询当急诊、拖着不挂号用伴侣当治疗师——三个都常见。\n- 收益：心理咨询总体疗效（第 9 条）、热线与就医路径（第 4 章第 19 条＋原书第 24 节）。\n- 证据等级：C\n- 来源：经验做法；分项证据见本条第 9 条、第 4 章第 19 条。\n- 备注：C 级（分诊流程本身无研究）。价格敏感：高校心理中心、社区心理服务、公益热线是三个低价入口。\n"];</script>

  {n:14, file:'book/14-人情往来的账.md',         name:'人情往来的账'},
  {n:15, file:'book/15-育儿中的关系.md',         name:'育儿中的关系'},
  {n:16, file:'book/16-别在网上把自己交出去.md', name:'别在网上把自己交出去'},
  {n:17, file:'book/17-婚姻的经营与修复.md',     name:'婚姻的经营与修复'},
